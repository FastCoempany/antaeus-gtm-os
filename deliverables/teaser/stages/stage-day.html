<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Antaeus — The Day (D3 stage)</title>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* D3 · THE DAY — 80s self-running stage.
   Brief: deliverables/teaser/brief-d3-the-day-2026-07-23.md
   One working day read off the instruments; the operator never appears. */
:root{
  --ink:#0a1c40; --orange:#e6701e; --forest:#1b5e3f; --red:#cf3b34; --blue:#2563eb;
  --serif:'DM Serif Display',Georgia,serif; --mono:'JetBrains Mono',monospace;
  --pale:#e8edf7;
}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;font-family:var(--serif);color:var(--ink)}
/* the field tracks the clock — pre-dawn → bright → warm slant → dim → night */
#field{position:absolute;inset:0;background:#eef2fa;transition:background-color 7s linear}
body.b9   #field{background:#f6f8fc}
body.b4pm #field{background:#f4f6fa}
body.b9pm #field{background:#dfe5f0}
body.night #field{background:#141f38;transition-duration:5s}
#bluecast{position:absolute;inset:0;opacity:.5;transition:opacity 9s linear;
  background:radial-gradient(1200px 700px at 50% 0%,rgba(37,99,235,.07),transparent)}
body.b9 #bluecast{opacity:0}
#warmslant{position:absolute;inset:0;opacity:0;transition:opacity 9s linear;
  background:linear-gradient(105deg,rgba(230,112,30,.05),transparent 55%)}
body.b4pm #warmslant{opacity:1}
body.night #warmslant{opacity:0}
#paper{position:absolute;inset:0;opacity:.55;
  background-image:linear-gradient(rgba(10,28,64,.04) 1px,transparent 1px),
    linear-gradient(90deg,rgba(10,28,64,.04) 1px,transparent 1px);
  background-size:33px 33px;transition:opacity 5s ease}
body.night #paper{opacity:.14}
/* the one full-orange moment (10:48) */
#ignite{position:absolute;inset:0;opacity:0;transition:opacity 1.1s ease;
  background:radial-gradient(1100px 640px at 50% 46%,rgba(230,112,30,.16),transparent)}
#ignite.on{opacity:1}

/* the clock — the film's metronome (top-right, honest jumps) */
#clock{position:absolute;top:44px;right:56px;font-family:var(--mono);font-weight:700;
  font-size:20px;letter-spacing:.14em;color:rgba(10,28,64,.62);display:flex}
body.night #clock{color:rgba(232,237,247,.62)}
#clock .ch{display:inline-block;white-space:pre}
#clock .ch.roll{animation:chroll .42s cubic-bezier(.3,.9,.3,1)}
@keyframes chroll{0%{transform:translateY(12px);opacity:0}100%{transform:translateY(0);opacity:1}}

/* the breathing dot — never leaves (low-left) */
#dot{position:absolute;left:58px;bottom:64px;width:7px;height:7px;border-radius:50%;
  background:var(--forest);opacity:0;transition:opacity 1.4s ease}
#dot.alive{opacity:1;animation:breath 3.2s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(27,94,63,.35)}
  50%{transform:scale(1.4);box-shadow:0 0 0 9px rgba(27,94,63,0)}}

/* the "earlier today" stack — the accumulator made visible (top-left) */
#stack{position:absolute;top:44px;left:56px;font-family:var(--mono);font-weight:700;
  font-size:12.5px;letter-spacing:.16em;color:rgba(10,28,64,.4);line-height:2.3}
body.night #stack{color:rgba(232,237,247,.4)}
#stack .line{opacity:0;transform:translateY(-6px);transition:opacity .7s ease,transform .7s ease}
#stack .line.in{opacity:1;transform:translateY(0)}
#stack .line.settle{opacity:0;transform:translateY(340px);transition:opacity 1.2s ease,transform 2.6s cubic-bezier(.45,.05,.55,.95)}
#stack.dim .line{opacity:.45}

/* the event — one hour's read, center frame */
#ev{position:absolute;left:0;right:0;top:38%;text-align:center;padding:0 240px}
#ev .tag{font-family:var(--mono);font-weight:700;font-size:13px;letter-spacing:.3em;
  margin-bottom:26px;opacity:0;transform:translateY(10px);transition:opacity .5s ease,transform .5s cubic-bezier(.3,.9,.3,1)}
#ev .tag.in{opacity:1;transform:translateY(0)}
#ev .tag.you{color:rgba(10,28,64,.55)} body.night #ev .tag.you{color:rgba(232,237,247,.55)}
#ev .tag.machine{color:var(--blue)}
#ev .tag.buyers{color:var(--orange)}
#ev .big{font-size:110px;line-height:1;margin-bottom:18px;display:flex;justify-content:center;gap:4px;
  opacity:0;transition:opacity .5s ease}
#ev .big.in{opacity:1}
#ev .big .d{display:inline-block}
#ev .big .d.roll{animation:chroll .5s cubic-bezier(.3,.9,.3,1)}
#ev .serif{font-size:64px;line-height:1.22;letter-spacing:-.01em;
  opacity:0;transform:translateY(12px);transition:opacity .55s ease,transform .55s cubic-bezier(.3,.9,.3,1)}
#ev .serif.in{opacity:1;transform:translateY(0)}
#ev .serif.small{font-size:44px;font-style:italic}
#ev .serif.red{color:var(--red)}
body.night #ev .serif{color:var(--pale)}
#ev .sub{font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.22em;
  color:rgba(10,28,64,.42);margin-top:30px;opacity:0;transform:translateY(8px);
  transition:opacity .55s ease,transform .55s ease}
#ev .sub.in{opacity:1;transform:translateY(0)}
body.night #ev .sub{color:rgba(232,237,247,.42)}
/* the 6:22 face-off bar (forest — the durable read) */
#bar{width:640px;margin:38px auto 0;opacity:0;transition:opacity .6s ease}
#bar.in{opacity:1}
#bar .track{height:12px;background:rgba(10,28,64,.12);border-radius:6px;overflow:hidden}
body.night #bar .track{background:rgba(232,237,247,.14)}
#bar .fill{height:100%;width:0;background:var(--forest);border-radius:6px;
  transition:width 2.4s cubic-bezier(.3,.9,.3,1)}
#bar.fill .fill{width:78.6%}

/* the settle — the day becomes the book (11:47) */
#book{position:absolute;left:50%;transform:translateX(-50%);bottom:130px;width:560px;height:300px;
  opacity:0;transition:opacity 1.6s ease}
#book.on{opacity:1}
#book .page{position:absolute;bottom:0;width:280px;height:280px;background:#fdfdfd;
  border:1.5px solid rgba(10,28,64,.16);box-shadow:0 18px 44px rgba(4,10,26,.35)}
#book .pl{left:0;border-radius:10px 3px 0 0;transform-origin:bottom right;transform:rotate(-1.6deg)}
#book .pr{right:0;border-radius:3px 10px 0 0;transform-origin:bottom left;transform:rotate(1.6deg)}
#book::after{content:'';position:absolute;left:50%;bottom:0;width:2px;height:272px;margin-left:-1px;
  background:rgba(10,28,64,.2)}
#book .pw{position:absolute;left:26px;right:26px;top:36px;font-family:var(--mono);font-weight:700;
  font-size:11px;letter-spacing:.16em;color:rgba(10,28,64,.42);line-height:2.5;
  opacity:0;transition:opacity 1.6s ease 1.2s}
#book.on .pw{opacity:1}

/* the closing mono (the loop) */
#tomorrow{position:absolute;left:0;right:0;top:47%;text-align:center;font-family:var(--mono);
  font-weight:700;font-size:15px;letter-spacing:.34em;color:rgba(232,237,247,.6);
  opacity:0;transition:opacity 1.4s ease}
#tomorrow.on{opacity:1}

/* end card */
#card{position:absolute;inset:0;background:#f6f8fc;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;opacity:0;transition:opacity 1.2s ease;z-index:50}
#card.on{opacity:1}
#card .k{font-family:var(--mono);font-weight:700;font-size:15px;letter-spacing:.3em;color:rgba(10,28,64,.5)}
#card .l{font-size:58px;color:var(--ink)}
#card .u{font-family:'Public Sans',sans-serif;font-size:20px;color:rgba(10,28,64,.6)}
</style>
</head>
<body>
<div id="field"></div><div id="bluecast"></div><div id="warmslant"></div>
<div id="paper"></div><div id="ignite"></div>

<div id="clock"></div>
<div id="stack"></div>

<div id="ev">
  <div class="tag"></div>
  <div class="big"></div>
  <div class="serif"></div>
  <div id="bar"><div class="track"><div class="fill"></div></div></div>
  <div class="sub"></div>
</div>

<div id="book">
  <div class="page pl"><div class="pw">6:04&nbsp;AWAKE<br>7:31&nbsp;THE&nbsp;MOVE<br>9:12&nbsp;COUNTED<br>10:48&nbsp;THE&nbsp;REPLY</div></div>
  <div class="page pr"><div class="pw">1:15&nbsp;CONFIRMED<br>3:40&nbsp;FLAGGED<br>6:22&nbsp;ANSWERED<br>THE&nbsp;DAY,&nbsp;KEPT</div></div>
</div>

<div id="tomorrow">6:04&nbsp;AM&nbsp;TOMORROW</div>

<div id="dot"></div>

<div id="card">
  <svg width="88" height="88" viewBox="0 0 48 48" fill="none">
    <path d="M14 38L24 10l10 28" stroke="#0a1c40" stroke-width="3.4"/>
    <path d="M18.2 28h11.6" stroke="#0a1c40" stroke-width="3.4"/>
    <path d="M2 38h44" stroke="#0a1c40" stroke-width="3.4"/></svg>
  <div class="k">ANTAEUS</div>
  <div class="l">It runs while you work.</div>
  <div class="u">antaeus.app</div>
</div>

<script>
const at=(ms,fn)=>setTimeout(fn,ms);
const $=(s)=>document.querySelector(s);
const ev={tag:$('#ev .tag'),big:$('#ev .big'),serif:$('#ev .serif'),sub:$('#ev .sub')};

/* clock — per-character roll on change */
function setClock(t){
  const el=$('#clock'), prev=el.textContent;
  el.innerHTML='';
  [...t].forEach((c,i)=>{
    const s=document.createElement('span'); s.className='ch'; s.textContent=c;
    if(prev[i]!==c) s.classList.add('roll');
    el.appendChild(s);
  });
}
/* the accumulator — age the hour into the stack */
function age(label){
  const d=document.createElement('div'); d.className='line'; d.textContent=label;
  $('#stack').appendChild(d); requestAnimationFrame(()=>requestAnimationFrame(()=>d.classList.add('in')));
}
/* one hour's event. Arrival = rise + fade; the tag stamps 80ms after the text. */
function show({tag,tagCls,serif,serifCls,sub,subDelay}){
  for(const k of ['tag','big','serif','sub']) ev[k].classList.remove('in');
  $('#bar').classList.remove('in');
  at(420,()=>{
    ev.big.innerHTML='';
    ev.serif.className='serif'+(serifCls?' '+serifCls:''); ev.serif.textContent=serif||'';
    ev.tag.className='tag'+(tagCls?' '+tagCls:''); ev.tag.textContent=tag||'';
    ev.sub.textContent=sub||'';
    if(serif) at(60,()=>ev.serif.classList.add('in'));
    if(tag) at(140,()=>ev.tag.classList.add('in'));
    if(sub) at(subDelay||520,()=>ev.sub.classList.add('in'));
  });
}
/* the 9:12 count — digits roll, nothing crossfades */
function rollBig(seq){
  ev.big.innerHTML='<span class="d"></span>'; ev.big.classList.add('in');
  const d=ev.big.querySelector('.d');
  seq.forEach((n,i)=>at(i*520,()=>{ d.textContent=n; d.classList.remove('roll'); void d.offsetWidth; d.classList.add('roll'); }));
}

function run(){
  /* 6:04 — the workspace is awake */
  at(0,()=>{ setClock('6:04 AM'); $('#dot').classList.add('alive');
    show({sub:'THE WORKSPACE IS AWAKE',subDelay:900}); });

  /* 7:31 — the one move (the longest morning hold) */
  at(6000,()=>{ setClock('7:31 AM'); age('6:04  AWAKE');
    show({serif:"Here's the one move that matters today.",
          sub:'OUTBOUND TO BOEING · THE REASON ATTACHED'}); });

  /* 9:12 — captured, counted */
  at(14000,()=>{ setClock('9:12 AM'); document.body.classList.add('b9'); age('7:31  OUTBOUND TO BOEING');
    show({tag:'YOU',tagCls:'you',serif:'Captured. Counted. Nobody logged anything.'});
    at(600,()=>rollBig(['4','5','6'])); });

  /* 10:48 — THE moment (the one orange frame) */
  at(22000,()=>{ setClock('10:48 AM'); age('9:12  6 CAPTURED');
    show({tag:'THE BUYERS',tagCls:'buyers',serif:'Starbucks replied — after 20 quiet days.'});
    $('#ignite').classList.add('on'); $('#stack').classList.add('dim'); });
  at(29500,()=>{ $('#ignite').classList.remove('on'); $('#stack').classList.remove('dim'); });

  /* 1:15 — the machine's quiet work */
  at(31000,()=>{ setClock('1:15 PM'); document.body.classList.add('b4pm'); age('10:48  STARBUCKS REPLIED');
    show({tag:'THE MACHINE',tagCls:'machine',serif:'Calendar — Thursday with United is confirmed.',
          sub:"NOTHING FOR YOU TO DO — IT'S ON THE BOOKS"}); });

  /* 3:40 — the red beat (the system says the hard thing) */
  at(38000,()=>{ setClock('3:40 PM'); age('1:15  UNITED CONFIRMED');
    show({serif:'Nordstrom has no dated next step. 21 days quiet.',serifCls:'red',
          sub:'THE SYSTEM SAYS THE HARD THING TOO',subDelay:2600});
    const d=$('#dot'); d.style.animationPlayState='paused';       /* the dot holds one breath */
    at(3200,()=>d.style.animationPlayState='running'); });

  /* 6:22 — the face-off fragment */
  at(47000,()=>{ setClock('6:22 PM'); age('3:40  NORDSTROM FLAGGED');
    show({serif:'Their 150 questions. Your 118 answers.'});
    at(900,()=>{ $('#bar').classList.add('in'); $('#bar').classList.add('fill'); }); });

  /* 9:30 — the lull (the film admits it; never cut) */
  at(55000,()=>{ setClock('9:30 PM'); document.body.classList.add('b9pm'); age('6:22  118 OF 150 ANSWERED');
    show({serif:"Nothing since 6:22. That's fine. The day is counted.",serifCls:'small'}); });

  /* 11:47 — the settle: the day becomes the book */
  at(61000,()=>{ setClock('11:47 PM'); document.body.classList.add('night');
    show({}); at(900,()=>{ $('#book').classList.add('on');
      [...document.querySelectorAll('#stack .line')].forEach((l,i)=>at(500+i*260,()=>l.classList.add('settle'))); }); });
  at(65200,()=>{ show({serif:'Every day ends in the book your first hire opens on day one.'}); });

  /* the dot alone — the loop closed */
  at(70500,()=>{ show({}); at(700,()=>{ $('#book').classList.remove('on'); $('#clock').style.opacity='0';
    $('#tomorrow').classList.add('on'); }); });

  /* end card */
  at(75500,()=>{ $('#card').classList.add('on'); });
}
if(new URLSearchParams(location.search).has('wait')){
  window.__go=()=>run();
}else{
  window.addEventListener('load',()=>{ at(600,run) });
}
</script>
</body>
</html>
