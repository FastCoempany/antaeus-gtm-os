<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auth gate — the Earth · settled · 2026-07-13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AUTH GATE — THE EARTH · SETTLED · 2026-07-13
   Founder pick from the Grounding triptych (GR-2), with the
   final adjustment: ANTAEUS · PRIVATE BUILD centered over the
   actual code box (not the input+button row).
   The gate: the bottom of the page is a faint forest stratum —
   the earth — under a permanent forest ground line. The lifted
   mark descends one step per typed digit; the right code lands
   it on the line and grows a root into the earth. Grounded
   means rooted.
   Demo: type any 6 digits + Enter. Short code = the error.
   ============================================================ */
:root{
  --field:#f6f8fc; --raised:#ffffff;
  --ink:#0a1c40;
  --ink-70:rgba(10,28,64,.70); --ink-50:rgba(10,28,64,.50);
  --ink-30:rgba(10,28,64,.30); --ink-14:rgba(10,28,64,.14);
  --ink-08:rgba(10,28,64,.08);
  --orange:#e6701e; --orange-dark:#d05f12;
  --forest:#1b5e3f; --red:#cf3b34;
  --forest-14:rgba(27,94,63,.14); --forest-08:rgba(27,94,63,.08);
  --serif:'DM Serif Display',Georgia,serif;
  --sans:'Public Sans',-apple-system,sans-serif;
  --mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--field);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}

.stage{position:relative;min-height:100vh;overflow:hidden;
  background-image:
    radial-gradient(circle at 12% 0%, rgba(37,99,235,.05), transparent 32%),
    radial-gradient(circle at 88% 8%, rgba(230,112,30,.04), transparent 30%),
    linear-gradient(var(--ink-08) 1px, transparent 1px),
    linear-gradient(90deg, var(--ink-08) 1px, transparent 1px);
  background-size:auto,auto,34px 34px,34px 34px;
  background-position:0 0,0 0,center 0,center 0}
.stage::before{content:"";position:absolute;inset:0;background:
  radial-gradient(ellipse at center, transparent 30%, rgba(246,248,252,.82) 100%);pointer-events:none}
.stage>*{position:relative;z-index:1}

.wrap{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  min-height:100vh;padding:9vh 24px 0}
.h1{margin:0 0 10px;text-align:center;font-family:var(--serif);
  font-size:clamp(2.2rem,4.6vw,3.9rem);line-height:1.04;letter-spacing:-.02em;text-wrap:balance;max-width:820px}
.sub{margin:0 0 40px;text-align:center;font-size:1rem;color:var(--ink-70);max-width:560px;line-height:1.65}

/* ---- the gate: kicker centered over the CODE BOX, not the row ---- */
.gate{display:grid;grid-template-columns:1fr auto;column-gap:8px;width:min(380px,100%);margin-bottom:12px}
.kicker{grid-column:1;font-family:var(--mono);font-size:.64rem;letter-spacing:.24em;
  text-transform:uppercase;font-weight:700;color:var(--ink-50);margin:0 0 12px;text-align:center}
.code-input{grid-column:1;grid-row:2;min-width:0;background:var(--raised);border:1px solid var(--ink-30);
  border-radius:9px;padding:13px 14px;color:var(--ink);font-family:var(--mono);font-size:1.05rem;
  letter-spacing:.28em;text-align:center;transition:border-color .14s,box-shadow .14s}
.code-input:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(230,112,30,.14)}
.code-input::placeholder{color:var(--ink-30);letter-spacing:.28em}
.enter-btn{grid-column:2;grid-row:2;background:var(--orange);border:1px solid var(--orange);color:#fff;
  font-family:var(--sans);font-weight:600;font-size:.95rem;padding:13px 22px;border-radius:9px;
  cursor:pointer;transition:background .14s,box-shadow .14s}
.enter-btn:hover{background:var(--orange-dark);box-shadow:0 6px 18px rgba(230,112,30,.22)}
.gate-err{grid-column:1;grid-row:3;margin:10px 0 0;font-size:.82rem;color:var(--red);
  text-align:center;min-height:1.25em}
.steps{grid-column:1;grid-row:4;display:flex;gap:10px;justify-content:center;margin-top:6px}
.step{width:26px;height:3px;background:rgba(27,94,63,.18);border-radius:2px;transition:background .2s}
.step.hit{background:var(--forest)}

.no-code{font-size:.84rem;line-height:1.7;color:var(--ink-50);text-align:center}
.no-code a{color:var(--forest);font-weight:600;text-decoration:none;border-bottom:1px dotted rgba(27,94,63,.45)}
.no-code a:hover{border-bottom-style:solid}

/* ---- the earth ---- */
.earthzone{position:relative;width:100%;height:320px;flex:none;margin-top:10px;align-self:stretch}
.ground{position:absolute;left:0;right:0;bottom:120px;height:3px;background:var(--forest)}
.earth{position:absolute;left:0;right:0;bottom:0;height:120px;
  background:linear-gradient(180deg, var(--forest-08) 0%, rgba(27,94,63,.02) 100%)}
.strata{position:absolute;left:0;right:0;bottom:0;height:120px;overflow:hidden;opacity:.5}
.strata i{position:absolute;left:0;right:0;height:1px;background:var(--forest-14)}
.mark{position:absolute;left:50%;bottom:99px;width:118px;height:118px;
  transform:translateX(-50%) translateY(-96px) rotate(-7deg);
  opacity:.32;transition:transform .45s cubic-bezier(.34,1.3,.5,1),opacity .45s ease}
.mark svg{width:100%;height:100%;display:block;overflow:visible}
.mark svg path{stroke:var(--ink)}
.mark.landed{transform:translateX(-50%) translateY(0) rotate(0deg)!important;opacity:1!important}
.rootline{position:absolute;left:50%;transform:translateX(-50%);bottom:65px;width:2.5px;height:0;
  background:var(--forest);transition:height .6s ease .25s}
.rootline.on{height:58px}
.landedline{position:absolute;left:50%;transform:translateX(-50%);bottom:26px;white-space:nowrap;
  font-family:var(--mono);font-size:.68rem;letter-spacing:.24em;text-transform:uppercase;
  font-weight:700;color:var(--forest);opacity:0;transition:opacity .4s}
.landedline.on{opacity:1}

/* ---- success wipe ---- */
.wipe{position:fixed;inset:0;background:var(--field);transform:translateY(101%);
  transition:transform .7s cubic-bezier(.6,0,.2,1);z-index:5;display:grid;place-items:center}
.wipe.on{transform:translateY(0)}
.wipe .inner{text-align:center}
.wipe .inner .mk{width:64px;margin:0 auto 18px}
.wipe .inner .mk svg{width:100%;display:block}
.wipe .inner h2{font-family:var(--serif);font-size:2rem;margin:0 0 8px}
.wipe .inner p{color:var(--ink-50);font-size:.9rem;margin:0}
</style>
</head>
<body>

<div class="stage">
  <div class="wrap">
    <h1 class="h1">Antaeus is strongest on the ground.</h1>
    <p class="sub">So is your sales motion. The private build is open to invited operators.</p>

    <form class="gate" id="gate-form" autocomplete="off">
      <p class="kicker">Antaeus · Private build</p>
      <input class="code-input" id="gate-input" type="text" inputmode="numeric" maxlength="6"
             placeholder="••••••" aria-label="Invite code">
      <button class="enter-btn" type="submit">Enter</button>
      <p class="gate-err" id="gate-err"></p>
      <div class="steps" id="gate-steps">
        <div class="step"></div><div class="step"></div><div class="step"></div>
        <div class="step"></div><div class="step"></div><div class="step"></div>
      </div>
    </form>

    <p class="no-code">No code? The private build is invite-only.<br>
    Write to <a href="mailto:founders@antaeus.app">founders@antaeus.app</a> and we'll get you in.</p>

    <div class="earthzone">
      <div class="mark" id="gate-mark">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M14 38L24 10l10 28" stroke-width="3.4"/>
          <path d="M18.2 28h11.6" stroke-width="3.4"/>
        </svg>
      </div>
      <div class="ground"></div>
      <div class="earth"></div>
      <div class="strata">
        <i style="bottom:88px"></i><i style="bottom:62px"></i><i style="bottom:38px"></i><i style="bottom:16px"></i>
      </div>
      <div class="rootline" id="gate-root"></div>
      <p class="landedline" id="gate-landed">GROUNDED · ROOTED</p>
    </div>
  </div>

  <div class="wipe" id="gate-wipe">
    <div class="inner">
      <div class="mk"><svg viewBox="0 0 48 48" fill="none">
        <path d="M14 38L24 10l10 28" stroke="#1b5e3f" stroke-width="3.4"/>
        <path d="M18.2 28h11.6" stroke="#1b5e3f" stroke-width="3.4"/>
        <path d="M2 38h44" stroke="#1b5e3f" stroke-width="3.4"/>
      </svg></div>
      <h2>You're in.</h2>
      <p>Opening the workspace…</p>
    </div>
  </div>
</div>

<script>
(function(){
  var input=document.getElementById('gate-input'),form=document.getElementById('gate-form'),
      mark=document.getElementById('gate-mark'),err=document.getElementById('gate-err'),
      steps=document.querySelectorAll('#gate-steps .step'),
      landed=document.getElementById('gate-landed'),wipe=document.getElementById('gate-wipe'),
      root=document.getElementById('gate-root');
  var LIFT=-96,TILT=-7;
  function setProgress(n){
    var f=n/6,y=LIFT*(1-f),r=TILT*(1-f),op=.32+.68*f;
    if(!mark.classList.contains('landed')){
      mark.style.transform='translateX(-50%) translateY('+y+'px) rotate('+r+'deg)';
      mark.style.opacity=op;
    }
    steps.forEach(function(s,i){s.classList.toggle('hit',i<n)});
  }
  input.addEventListener('input',function(){
    input.value=input.value.replace(/\D/g,'').slice(0,6);
    err.textContent='';setProgress(input.value.length);
  });
  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(input.value.length===6){
      mark.classList.add('landed');mark.style.transform='';mark.style.opacity='';
      root.classList.add('on');landed.classList.add('on');err.textContent='';
      setTimeout(function(){wipe.classList.add('on')},1000);
      setTimeout(function(){ /* demo reset */
        wipe.classList.remove('on');mark.classList.remove('landed');
        root.classList.remove('on');landed.classList.remove('on');
        input.value='';setProgress(0);
      },3800);
    }else{
      err.textContent="That code doesn't open anything yet. Check it and try again.";
      input.value='';setProgress(0);
    }
  });
  setProgress(0);
})();
</script>
</body>
</html>
