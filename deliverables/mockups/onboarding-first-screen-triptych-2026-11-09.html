<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Onboarding First Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@500;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  Onboarding first screen ("Before you start") — three versions for review.
  2026-11-09. Copy written to the rules agreed in conversation:
   - name things, never describe them by absence ("isn't written down anywhere")
   - no casual stand-in nouns ("the calls", "your read"), no judgment words
     ("honest", "yet", "really")
   - stakes come from buyers and deals, never from the app catching the user
   - no sentences built as rules with no exceptions ("any X will...")
   - concrete and about this reader ("is going to be an email")
   - "rank" is out; ordering words only describe what the software does
   - strictly true: every claim maps to current product behavior
  The three versions share the same copy. They differ only in where the
  sample of the Dashboard sits, whether its rows appear one at a time, and
  whether the line explaining the order is shown.
-->
<style>
:root {
  --field: #f5f7fb; --surface: #ffffff; --ink: #0a1c40;
  --ink-soft: rgba(10, 28, 64, 0.66); --ink-faint: rgba(10, 28, 64, 0.42);
  --hair: rgba(10, 28, 64, 0.07); --hair-strong: rgba(10, 28, 64, 0.14);
  --orange: #e6701e; --orange-strong: #d4661b; --orange-soft: rgba(230, 112, 30, 0.1);
  --blue: #2563eb; --green: #22c55e; --amber: #b45309; --amber-bg: rgba(245, 158, 11, 0.12);
  --red: #dc2626; --red-bg: rgba(239, 68, 68, 0.09);
  --serif: "DM Serif Display", serif;
  --sans: "Public Sans", -apple-system, system-ui, sans-serif;
  --mono: "JetBrains Mono", monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--field); color: var(--ink); font-family: var(--sans); }

/* review bar — not part of the design */
.rv { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; gap: 8px; align-items: center;
  padding: 8px 16px; background: var(--ink); color: #fff; font: 600 12px/1 var(--sans); }
.rv span { opacity: 0.6; margin-right: 6px; }
.rv a { color: #fff; text-decoration: none; padding: 6px 10px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2); }
.rv a.on { background: #fff; color: var(--ink); }
body.shot .rv { display: none; }
body:not(.shot) .frame { top: 34px; }

.frame { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr;
  background-image: radial-gradient(circle at 8% 0%, rgba(37,99,235,0.05), transparent 30%),
                    radial-gradient(circle at 94% 2%, rgba(230,112,30,0.04), transparent 26%); }
.frame.with-panel { grid-template-columns: 1fr 400px; }
.main { padding: 40px 56px 64px; display: flex; flex-direction: column; overflow: auto; }
.top { display: flex; justify-content: space-between; align-items: center; }
.mark { font-family: var(--serif); letter-spacing: 0.16em; font-size: 1rem; opacity: 0.85; }
.rail { display: flex; gap: 6px; }
.pip { width: 26px; height: 4px; border-radius: 2px; background: var(--hair-strong); }
.pip.on { background: var(--orange); }
.body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-top: 32px; }

.kicker { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--orange); font-weight: 700; margin-bottom: 16px; }
.h1 { font-family: var(--serif); font-weight: 400; font-size: clamp(2rem, 3.6vw, 3.2rem);
  line-height: 1.03; letter-spacing: -0.02em; margin-bottom: 20px; }
.h1 em { font-style: italic; }
.p { font-size: 1.06rem; line-height: 1.58; color: var(--ink-soft); max-width: 56ch; }
.p + .p { margin-top: 14px; }
.p strong { color: var(--ink); font-weight: 600; }
.foot { margin-top: 32px; }
.btn { font-family: var(--sans); font-size: 1rem; font-weight: 700; color: #fff; background: var(--orange);
  border: 0; border-radius: 12px; padding: 15px 26px; cursor: pointer;
  box-shadow: 0 10px 24px -12px rgba(230,112,30,0.6); }
.btn:hover { background: var(--orange-strong); }

/* the sample Dashboard */
.sample-k { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--blue); font-weight: 700; margin-bottom: 6px; }
.sample-sub { font-size: 0.86rem; color: var(--ink-faint); margin-bottom: 18px; }
.dash { background: var(--surface); border: 1px solid var(--hair-strong); border-radius: 12px; overflow: hidden;
  box-shadow: 0 18px 40px -28px rgba(10,28,64,0.35); }
.dash-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  padding: 14px 18px; border-bottom: 1px solid var(--hair); }
.dash-title { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--ink-faint); font-weight: 700; }
.dash-count { font-size: 0.8rem; color: var(--ink-soft); white-space: nowrap; }
.row { padding: 15px 18px; border-bottom: 1px solid var(--hair); display: grid; gap: 5px; }
.row:last-child { border-bottom: 0; }
.row-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.acct { font-weight: 700; font-size: 0.98rem; }
.meta { font-size: 0.78rem; color: var(--ink-faint); white-space: nowrap; }
.why { font-size: 0.86rem; color: var(--ink-soft); line-height: 1.45; }
.chip { justify-self: start; font-family: var(--mono); font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
  font-weight: 700; padding: 4px 7px; border-radius: 4px; }
.chip.red { color: var(--red); background: var(--red-bg); }
.chip.amber { color: var(--amber); background: var(--amber-bg); }
.row.first { background: linear-gradient(90deg, rgba(10,28,64,0.035), transparent 70%); border-left: 3px solid var(--ink); padding-left: 15px; }
.next { font-size: 0.86rem; font-weight: 600; color: var(--ink); }
.next b { font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); margin-right: 6px; }
.order { margin-top: 14px; font-size: 0.8rem; line-height: 1.5; color: var(--ink-faint); }
.order b { font-family: var(--mono); font-size: 9px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-faint); display: block; margin-bottom: 4px; }

/* rows appearing one at a time (B, C) — once, on load */
.stagger .row { opacity: 0; transform: translateY(8px); animation: rise 0.5s cubic-bezier(0.2,0.7,0.2,1) forwards; }
.stagger .row:nth-child(2) { animation-delay: 0.5s; }
.stagger .row:nth-child(3) { animation-delay: 1.1s; }
.stagger .row:nth-child(4) { animation-delay: 1.7s; }
@keyframes rise { to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .stagger .row { opacity: 1; transform: none; animation: none; } }
body.shot .stagger .row { opacity: 1; transform: none; animation: none; }

/* A — sample in the right-hand panel */
.panel { background: var(--surface); border-left: 1px solid var(--hair); padding: 40px 28px; overflow: auto; }
.panel .dash { box-shadow: none; }

/* B — sample under the copy, above the button; rows on one line each */
.compact .sample-sub { margin-bottom: 12px; }
.compact .row { grid-template-columns: 190px 110px 1fr auto; align-items: center; gap: 16px; padding: 11px 18px; }
.compact .row.first { padding-left: 15px; }
.compact .row-top { display: contents; }
.compact .acct { order: 1; } .compact .chip { order: 2; justify-self: start; }
.compact .why { order: 3; } .compact .meta { order: 4; }
.compact .next { display: none; }
.b-copy { max-width: 760px; }
.b-sample { max-width: 900px; margin-top: 26px; }

/* C — sample first, copy beside it */
.c-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 56px; align-items: center; max-width: 1200px; }
.c-grid .h1 { font-size: clamp(2rem, 3vw, 2.8rem); }

.v { display: none; }
.v.on { display: grid; }
</style>
</head>
<body>
<div class="rv"><span>Review</span>
  <a href="?v=a" data-v="a">A · Sample in the side panel</a>
  <a href="?v=b" data-v="b">B · Sample under the copy</a>
  <a href="?v=c" data-v="c">C · Sample first</a>
</div>

<template id="copy">
  <p class="kicker">Before you start</p>
  <h1 class="h1">This setup needs real thought from <em>you</em>.</h1>
  <p class="p">You'll enter what only you know: who you sell to, which companies you're going after, and where each of your open deals stands. For every deal, that's who's championing it, who signs, and what's holding it up. Without that, the first sign one of your deals is in trouble is going to be an email saying they went with someone else.</p>
  <p class="p"><strong>You enter this once.</strong> Every morning after, your Dashboard opens on what needs you first, and why. Your open deals are lined up behind it in order of risk, so the ones that have gone quiet or have no next step booked come first. Add the deals you're unsure about too. They'll show up there with the rest.</p>
</template>

<template id="sample">
  <p class="sample-k">Sample · Your Dashboard</p>
  <p class="sample-sub">What you'll open to once setup is done. These deals are examples.</p>
  <div class="dash">
    <div class="dash-head"><span class="dash-title">Open deals · in order of risk</span><span class="dash-count">10 open · 3 at risk</span></div>
    <div class="rows">
      <div class="row first">
        <div class="row-top"><span class="acct">Northwind Robotics</span><span class="meta">$84,000 · Proposal</span></div>
        <span class="chip red">At risk</span>
        <p class="why">No activity logged in 16 days. No next step booked.</p>
        <p class="next"><b>Next step</b>Book the next meeting with your champion</p>
      </div>
      <div class="row">
        <div class="row-top"><span class="acct">Corvel Health</span><span class="meta">$120,000 · Pilot</span></div>
        <span class="chip amber">Pilot ending</span>
        <p class="why">Pilot ends in 9 days. No results meeting booked.</p>
      </div>
      <div class="row">
        <div class="row-top"><span class="acct">Halden Freight</span><span class="meta">$52,000 · Discovery</span></div>
        <span class="chip amber">Incomplete</span>
        <p class="why">Champion not recorded. Person who signs not recorded.</p>
      </div>
    </div>
  </div>
</template>

<template id="order">
  <p class="order"><b>How the order is set</b>Days since the last logged activity, whether a next step is booked, how close the close date is, and the deal's value.</p>
</template>

<template id="chrome">
  <div class="top"><span class="mark">ANTAEUS</span>
    <div class="rail"><span class="pip on"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span><span class="pip"></span></div>
  </div>
</template>

<template id="button">
  <div class="foot"><button class="btn" type="button">Begin with who you sell to →</button></div>
</template>

<!-- A -->
<div class="frame with-panel v" id="v-a">
  <main class="main"><div data-use="chrome"></div>
    <div class="body"><div style="max-width:760px"><div data-use="copy"></div><div data-use="button"></div></div></div>
  </main>
  <aside class="panel"><div data-use="sample"></div><div data-use="order"></div></aside>
</div>

<!-- B -->
<div class="frame v" id="v-b">
  <main class="main"><div data-use="chrome"></div>
    <div class="body">
      <div class="b-copy" data-use="copy"></div>
      <div class="b-sample stagger compact" data-use="sample"></div>
      <div data-use="button"></div>
    </div>
  </main>
</div>

<!-- C -->
<div class="frame v" id="v-c">
  <main class="main"><div data-use="chrome"></div>
    <div class="body">
      <div class="c-grid">
        <div class="stagger"><div data-use="sample"></div><div data-use="order"></div></div>
        <div><div data-use="copy"></div><div data-use="button"></div></div>
      </div>
    </div>
  </main>
</div>

<script>
  document.querySelectorAll("[data-use]").forEach(function (el) {
    var tpl = document.getElementById(el.getAttribute("data-use"));
    el.appendChild(tpl.content.cloneNode(true));
  });
  var params = new URLSearchParams(location.search);
  var v = params.get("v") || "a";
  if (params.get("shot") === "1") document.body.classList.add("shot");
  var view = document.getElementById("v-" + v) || document.getElementById("v-a");
  view.classList.add("on");
  document.querySelectorAll(".rv a").forEach(function (a) {
    if (a.getAttribute("data-v") === v) a.classList.add("on");
  });
</script>
</body>
</html>
