<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Antaeus — the explainer</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:"DM Serif Display";src:url(fonts/DMSerifDisplay-normal-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"DM Serif Display";src:url(fonts/DMSerifDisplay-italic-400.woff2) format("woff2");font-weight:400;font-style:italic}
@font-face{font-family:"Public Sans";src:url(fonts/PublicSans-normal-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Public Sans";src:url(fonts/PublicSans-normal-600.woff2) format("woff2");font-weight:600}
@font-face{font-family:"Public Sans";src:url(fonts/PublicSans-normal-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"JetBrains Mono";src:url(fonts/JetBrainsMono-normal-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"JetBrains Mono";src:url(fonts/JetBrainsMono-normal-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Caveat";src:url(fonts/Caveat-variable.woff2) format("woff2");font-weight:400 700}
@font-face{font-family:"Kalam";src:url(fonts/Kalam-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Kalam";src:url(fonts/Kalam-700.woff2) format("woff2");font-weight:700}
@font-face{font-family:"Patrick Hand";src:url(fonts/PatrickHand-400.woff2) format("woff2");font-weight:400}
html,body{margin:0;height:100%;background:#0a1c40;overflow:hidden;font-family:"Public Sans",system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{background:#f6f8fc;box-shadow:0 30px 80px rgba(0,0,0,.45)}
#cover{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(10,28,64,.55);backdrop-filter:blur(2px);cursor:pointer;color:#f6f8fc;transition:opacity .35s}
#cover.hide{opacity:0;pointer-events:none}
#cover .btn{display:flex;align-items:center;gap:14px;background:#f6f8fc;color:#0a1c40;border-radius:999px;padding:16px 28px 16px 22px;font:600 18px "Public Sans",sans-serif;box-shadow:0 12px 40px rgba(0,0,0,.35)}
#cover .btn svg{width:26px;height:26px}
#cover .hint{font:400 13px "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
#bar{position:fixed;left:0;bottom:0;height:3px;background:#e6701e;width:0%}
#ctl{position:fixed;right:14px;bottom:12px;font:400 12px "JetBrains Mono",monospace;color:rgba(246,248,252,.6);letter-spacing:.1em;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="cover">
  <div class="btn"><svg viewBox="0 0 24 24" fill="#0a1c40"><path d="M8 5v14l11-7z"/></svg> Play with sound</div>
  <div class="hint">Antaeus · 52 seconds · space to pause · R to restart</div>
</div>
<div id="bar"></div><div id="ctl"></div>
<script type="module" src="src/film.js"></script>
</body>
</html>
