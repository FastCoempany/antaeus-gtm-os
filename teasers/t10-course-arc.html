<!-- teaser id=course-arc num=10 source=aesdr focal=50%,50% loop=8 interactive=no -->
<div class="stage t10" data-teaser="course-arc" style="--fx:0.5;--fy:0.5" role="img" aria-label="Seven courses numbered along a shallow curve, the third one lit and named">
  <div class="stage-frame"><div class="stage-scene">
    <div class="t10-sheet">
      <div class="t10-head">
        <span class="t10-kicker">Seven courses</span>
        <span class="t10-count"><span class="t10-cur t10-fade-a">03 / 07</span><span class="t10-cur t10-swap-b">04 / 07</span></span>
      </div>
      <div class="t10-arc">
        <svg class="t10-svg" viewBox="0 0 1280 316" aria-hidden="true"></svg>
      </div>
    </div>
  </div></div>
</div>
<style>
.t10 .t10-sheet, .t10 .t10-head, .t10 .t10-arc, .t10 .t10-count { box-sizing: border-box; }
.t10 .t10-sheet {
  position: absolute; left: 8.5%; top: 18%; width: 83%; height: calc(40 * var(--u));
  padding: calc(7 * var(--u)) 0;
  background: var(--aes-paper); color: var(--aes-ink);
  border: calc(0.0625 * var(--u)) solid var(--aes-light);
  display: flex; flex-direction: column;
}
.t10 .t10-head {
  display: flex; justify-content: center; align-items: baseline; gap: calc(5 * var(--u));
  padding-bottom: calc(1.6 * var(--u));
  border-bottom: calc(0.0625 * var(--u)) solid var(--aes-light);
}
.t10 .t10-kicker, .t10 .t10-count, .t10 .t10-cur {
  font-family: var(--aes-font-mono); font-weight: var(--aes-weight-mono);
  font-size: calc(1.25 * var(--u)); line-height: 1.3;
  letter-spacing: var(--aes-eyebrow-track); text-transform: var(--aes-label-case);
  color: var(--aes-muted); white-space: nowrap;
}
/* both readings share one cell, so the swap cannot shift the running head */
.t10 .t10-count { display: inline-grid; }
.t10 .t10-cur { grid-area: 1 / 1; }
.t10 .t10-arc { width: calc(70 * var(--u)); margin: calc(5 * var(--u)) auto 0; }
.t10 .t10-svg { display: block; width: 100%; aspect-ratio: 1280 / 316; overflow: visible; }

.t10 .t10-track { fill: none; stroke: var(--aes-form-border); stroke-width: 2.5; stroke-dasharray: 2.5 9; stroke-linecap: round; opacity: 0.75; }
.t10 .t10-prog { fill: none; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 100; stroke-dashoffset: 66.667; }
.t10 .t10-ring { fill: var(--aes-paper); stroke: var(--aes-form-border); stroke-width: 2.4; }
.t10 .t10-mark.is-done .t10-ring { fill: var(--aes-crimson); stroke: var(--aes-crimson); }
.t10 .t10-num { font-family: var(--aes-font-mono); letter-spacing: 0.06em; text-anchor: middle; dominant-baseline: central; fill: var(--aes-muted); }
.t10 .t10-mark.is-done .t10-num { fill: var(--aes-paper); }
.t10 .t10-fill { fill: var(--aes-crimson); opacity: 0; }
.t10 .t10-numlight { fill: var(--aes-paper); opacity: 0; }

.t10 .t10-glow { transform-box: view-box; transform-origin: 0 0; transform: translate(var(--p3x, 446.8px), var(--p3y, 105.6px)); will-change: transform; }
.t10 .t10-halo { fill: var(--aes-crimson); opacity: 0.12; }
.t10 .t10-halo2 { fill: var(--aes-crimson); opacity: 0.26; }
.t10 .t10-disc { fill: var(--aes-paper); stroke: var(--aes-ink); stroke-width: 3; }
.t10 .t10-gnum { font-family: var(--aes-font-mono); letter-spacing: 0.06em; text-anchor: middle; dominant-baseline: central; fill: var(--aes-ink); }
.t10 .t10-leader { stroke: var(--aes-form-border); stroke-width: 2; }
.t10 .t10-title { font-family: var(--aes-font-body); font-weight: var(--aes-weight-body-strong); text-anchor: middle; fill: var(--aes-ink); }
.t10 .t10-fade-b, .t10 .t10-swap-b { opacity: 0; }

/* the name clears before the marker moves and resolves once it lands, so two
   courses never print over each other */
.t10 .t10-glow { animation: t10-step 8s var(--aes-loop-ease) infinite; }
.t10 .t10-prog { animation: t10-prog 8s var(--aes-loop-ease) infinite; }
.t10 .t10-fade-a { animation: t10-fade-a 8s ease-in-out infinite; }
.t10 .t10-fade-b { animation: t10-fade-b 8s ease-in-out infinite; }
.t10 .t10-swap-b { animation: t10-swap-b 8s ease-in-out infinite; }
.t10 .t10-leader { animation: t10-leader 8s ease-in-out infinite; }
.t10 .t10-fill, .t10 .t10-numlight { animation: t10-settle 8s ease-in-out infinite; }
@keyframes t10-step {
  0%, 18% { transform: translate(var(--p3x, 446.8px), var(--p3y, 105.6px)); }
  28%, 62% { transform: translate(var(--p4x, 640px), var(--p4y, 99px)); }
  72%, 100% { transform: translate(var(--p3x, 446.8px), var(--p3y, 105.6px)); }
}
@keyframes t10-prog {
  0%, 18% { stroke-dashoffset: 66.667; }
  28%, 62% { stroke-dashoffset: 50; }
  72%, 100% { stroke-dashoffset: 66.667; }
}
@keyframes t10-fade-a { 0%, 13% { opacity: 1; } 18%, 72% { opacity: 0; } 77%, 100% { opacity: 1; } }
@keyframes t10-fade-b { 0%, 28% { opacity: 0; } 33%, 57% { opacity: 1; } 62%, 100% { opacity: 0; } }
@keyframes t10-swap-b { 0%, 13% { opacity: 0; } 18%, 72% { opacity: 1; } 77%, 100% { opacity: 0; } }
@keyframes t10-leader {
  0%, 13% { opacity: 1; } 18%, 28% { opacity: 0; }
  33%, 57% { opacity: 1; } 62%, 72% { opacity: 0; } 77%, 100% { opacity: 1; }
}
@keyframes t10-settle { 0%, 22% { opacity: 0; } 30%, 64% { opacity: 1; } 70%, 100% { opacity: 0; } }
</style>
<script>
(function () {
  var seq = 0;
  var roots = document.querySelectorAll(".stage.t10");
  Array.prototype.forEach.call(roots, function (root) {
    if (root.dataset.ready) return;
    root.dataset.ready = "1";
    seq += 1;
    var NS = "http://www.w3.org/2000/svg";
    var svg = root.querySelector(".t10-svg");
    var uid = "t10i" + seq + "x" + Math.floor(performance.now());
    var D = "M 64 158 Q 640 40 1216 158";
    var TITLES = ["Find the pain", "Show it is real"];

    function make(tag, attrs, cls) {
      var el = document.createElementNS(NS, tag);
      if (cls) el.setAttribute("class", cls);
      for (var k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    }
    /* the iris, on exactly one element: the stretch of the course already walked */
    var defs = make("defs", {});
    var grad = make("linearGradient", { x1: "0", x2: "1", y1: "0", y2: "0" });
    grad.setAttribute("id", uid);
    [["0", "#FF006E"], [".17", "#FF6B00"], [".34", "#F59E0B"], [".51", "#10B981"], [".68", "#38BDF8"], [".85", "#8B5CF6"], ["1", "#FF006E"]]
      .forEach(function (s) { grad.appendChild(make("stop", { offset: s[0], "stop-color": s[1] })); });
    defs.appendChild(grad);
    svg.appendChild(defs);

    var track = make("path", { d: D }, "t10-track");
    svg.appendChild(track);
    var prog = make("path", { d: D, pathLength: "100", stroke: "url(#" + uid + ")" }, "t10-prog");
    svg.appendChild(prog);

    var total = track.getTotalLength();
    var pts = [];
    for (var i = 0; i < 7; i++) {
      var p = total ? track.getPointAtLength(total * i / 6) : { x: 64 + i * 192, y: 130 };
      pts.push(p);
      var g = make("g", { transform: "translate(" + p.x.toFixed(1) + " " + p.y.toFixed(1) + ")" },
        "t10-mark" + (i < 2 ? " is-done" : ""));
      g.appendChild(make("circle", { r: "27" }, "t10-ring"));
      if (i === 2) g.appendChild(make("circle", { r: "27" }, "t10-fill"));
      var n = make("text", { "font-size": "30" }, "t10-num");
      n.textContent = String(i + 1);
      g.appendChild(n);
      if (i === 2) {
        var nl = make("text", { "font-size": "30" }, "t10-num t10-numlight");
        nl.textContent = "3";
        g.appendChild(nl);
      }
      svg.appendChild(g);
    }
    root.style.setProperty("--p3x", pts[2].x.toFixed(1) + "px");
    root.style.setProperty("--p3y", pts[2].y.toFixed(1) + "px");
    root.style.setProperty("--p4x", pts[3].x.toFixed(1) + "px");
    root.style.setProperty("--p4y", pts[3].y.toFixed(1) + "px");

    /* the lit course carries its own leader and name, so the caption never parts
       company with the marker it belongs to, on the wide frame or the phone crop */
    var glow = make("g", {}, "t10-glow");
    glow.appendChild(make("circle", { r: "56" }, "t10-halo"));
    glow.appendChild(make("circle", { r: "38" }, "t10-halo2"));
    glow.appendChild(make("circle", { r: "27" }, "t10-disc"));
    glow.appendChild(make("line", { x1: "0", y1: "62", x2: "0", y2: "124" }, "t10-leader"));
    ["a", "b"].forEach(function (k, j) {
      var n = make("text", { "font-size": "30" }, "t10-gnum t10-fade-" + k);
      n.textContent = String(j + 3);
      glow.appendChild(n);
      var t = make("text", { y: "180", "font-size": "64" }, "t10-title t10-fade-" + k);
      t.textContent = TITLES[j];
      glow.appendChild(t);
    });
    svg.appendChild(glow);

    /* hold both names inside the phone crop whatever face the browser lands on */
    var LO = 183, HI = 1097;
    Array.prototype.forEach.call(glow.querySelectorAll(".t10-title"), function (t, j) {
      var len = 0;
      try { len = t.getComputedTextLength(); } catch (e) { len = 0; }
      if (!len) return;
      var cx = pts[j + 2].x, half = len / 2;
      var shift = Math.min(Math.max(cx, LO + half), HI - half) - cx;
      if (Math.abs(shift) > 1) t.setAttribute("x", shift.toFixed(1));
    });
  });
})();
</script>
