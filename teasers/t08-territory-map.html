<script>

    var cols = [], rows = [], sx = [], sy = [], x = 14, y = 16, i = 0, j = 0;

      var bx = cols[c][0], bw = cols[c][1], by = rows[r][0], bh = rows[r][1];

    }
    /* two diagonal avenues cut across the grid */
    el("path", { d: "M 60 30 L 660 704", "class": "t08-ave" });
    el("path", { d: "M 500 20 L 902 334", "class": "t08-ave" });

    /* the old quarter: a smaller grid turned nineteen degrees, cut to its own outline */
    el("polygon", { points: poly, "class": "t08-lot" });
    var clip = el("clipPath", { id: uid }, el("defs", {}));
    el("polygon", { points: poly }, clip);
    var gR = el("g", { transform: "rotate(-19 160 600)" }, el("g", { "clip-path": "url(#" + uid + ")" }));
    for (var gx = 0, ci = 0; gx < 340; ci++) { var dw = Math.round(30 + rnd() * 22); for (var gy2 = 430; gy2 < 790;) { var dh = Math.round(22 + rnd() * 16); if (rnd() > 0.06) el("rect", { x: gx, y: gy2, width: dw, height: dh, rx: 1, "class": "t08-block" }, gR); gy2 += dh + 5; } gx += dw + (ci % 3 === 1 ? 8 : 5); }
    el("polygon", { points: poly, "class": "t08-edge" });

    /* the river, its banks, and the lake with its depth contours */
    var riverD = "M 336 -12 C 342 90 262 170 318 262 C 362 334 486 356 574 392 C 668 430 782 428 936 470";
    el("path", { d: riverD, "class": "t08-bank" });
    var river = el("path", { d: riverD, "class": "t08-river" });
    var coastD = "M 892 -12 C 870 70 924 150 898 236 C 876 310 850 372 900 446 C 942 508 966 574 926 640 C 898 686 884 720 906 752";
    el("path", { d: coastD + " L 1230 752 L 1230 -12 Z", "class": "t08-water" });
    [[22, 1], [46, 0.7], [72, 0.45]].forEach(function (o) { el("path", { d: coastD, transform: "translate(" + o[0] + " 0)", opacity: o[1], "class": "t08-contour" }); });
    el("path", { d: coastD, "class": "t08-coast" });
    var len = river.getTotalLength();
    [0.4, 0.72].forEach(function (t) { var p = river.getPointAtLength(len * t), p2 = river.getPointAtLength(len * t + 1); var dx = p2.x - p.x, dy = p2.y - p.y, m = Math.hypot(dx, dy) || 1, nx = -dy / m * 14, ny = dx / m * 14; el("line", { x1: f(p.x - nx), y1: f(p.y - ny), x2: f(p.x + nx), y2: f(p.y + ny), "class": "t08-bridge" }); });

    /* the tick rule along the foot of the plate */
    var minor = "", major = "";
    for (var k = 0; k <= 58; k++) { var tx = 20 + k * 20; if (k % 5 === 0) major += "M" + tx + " 740v-11"; else minor += "M" + tx + " 740v-5"; }
    el("path", { d: minor, "class": "t08-tick" });
    el("path", { d: major, "class": "t08-tick t08-tick-major" });

    /* clusters sit on street crossings; the home cluster carries the lamp and the zoning bands */
    var C = {};
    [["H", 310, 430, 8], ["A", 250, 170, 7], ["B", 560, 290, 9], ["C", 750, 560, 8], ["D", 470, 630, 6], ["E", 800, 140, 5], ["F", 110, 300, 6]].forEach(function (d) {

      for (var k = 0; k < d[3]; k++) { var a = k * Math.PI * 2 / d[3] + (rnd() - 0.5) * 0.9 + 0.4, rad = 17 + rnd() * 27; pts.push([f(cx + Math.cos(a) * rad), f(cy + Math.sin(a) * rad)]); }
      C[d[0]] = { x: cx, y: cy, pts: pts };
    });
    [[72, "t08-band t08-band-in"], [150, "t08-band"], [262, "t08-band"], [404, "t08-band"]].forEach(function (b) { el("circle", { cx: C.H.x, cy: C.H.y, r: b[0], "class": b[1] }); });
    function drawCluster(c, g, home) {
      c.pts.forEach(function (p) { el("line", { x1: c.x, y1: c.y, x2: p[0], y2: p[1], "class": "t08-spoke" }, g); });
      c.pts.forEach(function (p) { el("circle", { cx: p[0], cy: p[1], r: 2, "class": "t08-sat" }, g); });

      else el("circle", { cx: c.x, cy: c.y, r: 4, "class": "t08-core" }, g);

    el("path", { d: routeD, pathLength: 100, "class": "t08-route t08-route-glow" });
