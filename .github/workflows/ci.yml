# ci.yml — Antaeus GTM OS continuous integration
#
# Runs on every pull request and every push to non-main branches. Gates
# merge into main: PR cannot merge unless all required jobs below are green.
#
# Jobs are intentionally split so failures point to the specific category
# (typecheck vs. unit test vs. E2E vs. build). Each job runs independently
# so a flaky E2E doesn't block a typecheck failure from being fixed.
#
# See deliverables/adr/adr-001-foundation-stack-migration-2026-04-21.md §6 Phase 1.3.

name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  unit-test:
    name: Unit + component tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Run unit and component tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Publish test failure summary
        if: failure()
        shell: bash
        run: |
          echo '## Unit/component test failure output' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 220 test-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Post PR diagnostic on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '<!-- antaeus-ci-unit-diagnostic -->'
            echo '### CI unit-test diagnostic'
            echo '```text'
            tail -n 220 test-output.txt || true
            echo '```'
          } > ci-diagnostic.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file ci-diagnostic.md

  e2e-test:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    # Pin the official Playwright image to the package version in package.json.
    # The image contains the matching Chromium build, avoiding a second CDN
    # download during CI while keeping browser/runtime versions deterministic.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --no-audit --no-fund
      - name: Run E2E smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-output.txt
      - name: Publish E2E failure summary
        if: failure()
        shell: bash
        run: |
          echo '## E2E failure output' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 220 e2e-output.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Post PR E2E diagnostic on failure
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '<!-- antaeus-ci-e2e-diagnostic -->'
            echo '### CI E2E diagnostic'
            echo '```text'
            tail -n 220 e2e-output.txt || true
            echo '```'
          } > ci-e2e-diagnostic.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file ci-e2e-diagnostic.md
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Vite build
        run: npm run build
      - name: Cloudflare static assets build
        run: npm run build:cloudflare
      - name: Verify dist/ emitted
        run: |
          test -d dist || (echo "dist/ missing" && exit 1)
          ls -la dist/
