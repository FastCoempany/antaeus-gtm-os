name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-transcript:
    name: One-time preview transcript regeneration
    if: github.event_name == 'push' && github.ref_name == 'language-remediation-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: language-remediation-v1
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate AI-readable preview transcript
        run: node tools/preview/build-transcript.js
      - name: Commit regenerated transcript if changed
        shell: bash
        run: |
          if git diff --quiet -- preview-transcript; then
            echo "Transcript already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-transcript
          git commit -m "Regenerate preview transcript after language remediation"
          git push origin HEAD:language-remediation-v1

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  unit-test:
    name: Unit + component tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Run unit and component tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload unit-test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: test-output.txt
          retention-days: 7

  e2e-test:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci --no-audit --no-fund
      - name: Run E2E smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-output.txt
      - name: Upload E2E output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output.txt
          retention-days: 7
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Vite build
        run: npm run build
      - name: Cloudflare static assets build
        run: npm run build:cloudflare
      - name: Verify dist/ emitted
        run: |
          test -d dist || (echo "dist/ missing" && exit 1)
          ls -la dist/
