name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck

  functions-typecheck:
    name: Edge function typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run typecheck:functions

  unit-test:
    name: Unit + component tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - run: npm run copy:test
      - name: Run unit and component tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      - name: Upload unit-test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-output
          path: test-output.txt
          retention-days: 7

  e2e-test:
    name: E2E smoke tests (Playwright)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Run E2E smoke tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-output.txt
      - name: Upload E2E output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output.txt
          retention-days: 7
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Vite build
        run: npm run build
      - name: Cloudflare static assets build
        run: npm run build:cloudflare
      - name: Verify dist/ emitted
        run: |
          test -d dist || (echo "dist/ missing" && exit 1)
          ls -la dist/

  # Decides whether the rendered language audit needs to run. The audit walks
  # the whole enterprise demo (~30 min), which only matters when something a
  # customer can see might have changed. PRs that only touch workflows (other
  # than this file), docs, root-level Markdown or non-rendered deliverables
  # skip it. The capability maps are rendered into the walkthrough, so they
  # still count as visible.
  language-audit-scope:
    name: Rendered language audit scope
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || ! changed=$(git diff --name-only "$base" HEAD 2>/dev/null); then
            echo "Could not work out the changed files; running the audit."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          visible=$(printf '%s\n' "$changed" | grep -v '^$' | grep -vE \
            -e '^\.github/' \
            -e '^docs/' \
            -e '^[^/]+\.md$' \
            -e '^deliverables/' \
            || true)
          # Exceptions to the skip list: this workflow, and the deliverables
          # that the walkthrough embeds.
          visible="$visible
          $(printf '%s\n' "$changed" | grep -E \
            -e '^\.github/workflows/ci\.yml$' \
            -e '^deliverables/room-capability-maps/' \
            -e '^deliverables/design-principle-strict-bible/08-room-guardian-specs/' \
            || true)"
          if [ -n "$(printf '%s' "$visible" | tr -d '[:space:]')" ]; then
            echo "Customer-visible files changed; running the audit:"
            printf '%s\n' "$visible" | sed '/^[[:space:]]*$/d' | head -20
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only workflows, docs or non-rendered deliverables changed; skipping the audit."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  language-audit:
    name: Rendered language audit
    needs: language-audit-scope
    if: needs.language-audit-scope.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble
    env:
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci --no-audit --no-fund
      - name: Build the current tester application
        run: npm run build:cloudflare
      - name: Regenerate the full demo-seeded tester walkthrough
        run: npm run build:transcript
      - name: Verify room and interaction coverage
        run: npm run copy:validate
      - name: Rebuild rendered copy inventory
        run: npm run copy:inventory
      - name: Run Tier-1 language regression gate
        shell: bash
        run: |
          set -o pipefail
          npm run copy:audit 2>&1 | tee artifacts/language-remediation/copy-audit.txt
      - name: Upload language-validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: language-validation
          path: |
            artifacts/language-remediation/copy-inventory.json
            artifacts/language-remediation/copy-audit.txt
            artifacts/language-remediation/copy-audit.json
            artifacts/language-remediation/rendered-corpus.txt
            preview-transcript/
          retention-days: 14
