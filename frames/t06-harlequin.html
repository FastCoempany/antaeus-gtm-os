<!-- frame id=harlequin num=6 source=puff-junction focal=38%,50% loop=9 interactive=no -->
<div class="stage f06" data-frame="harlequin" style="--fx:0.38;--fy:0.50" role="img"
     aria-label="A diagonal checkerboard cut into a concrete wall, dense at the left and thinning to the right along a ragged staircase edge. Individual diamonds drop out and return; they never fade">
  <div class="stage-frame">
    <div class="stage-scene">
      <div class="f06-wall m-concrete"></div>
      <div class="f06-cells m-harlequin" aria-hidden="true"></div>
      <div class="f06-seam m-concrete-seam"></div>
      <div class="f06-vignette"></div>
    </div>
  </div>
</div>
<style>
/* Frame 6 — the corner detail as the whole wall.
   Materials: pj-concrete (achromatic #565656, cloudy mottling, aggregate
   speckle, the troweled streak, and the crisp parting seam) and pj-harlequin
   (cells 13–14 mm on point, dark cells a 25–35% value shift on the same
   material rather than a fill).
   On the product this is a detail at 13 mm running down one vertical corner.
   Here it is the elevation, and you can watch it eat: the staircase front
   advances and retreats and individual cells drop out entirely, because the
   real dissolve is never an opacity fade.
   The cells are generated rather than tiled — a gradient cannot drop a single
   cell — and each one carries the concrete's own grain through it. */
.f06 .f06-wall { position: absolute; inset: 0; --c-cell: 26%; }
.f06 .f06-cells { position: absolute; inset: 0; }
.f06 .f06-cells i {
  position: absolute;
  clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%);
  background: rgba(0, 0, 0, var(--hq-shift, 0.28));
  mix-blend-mode: multiply;
  animation: f06-drop 9s ease-in-out infinite;
}
.f06 .f06-seam { position: absolute; left: 0; right: 0; top: 50%; }
.f06 .f06-vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(128% 100% at 38% 48%, transparent 44%, rgba(0, 0, 0, 0.55) 100%);
}
@keyframes f06-drop {
  0%, 38% { opacity: 1; }
  52%, 64% { opacity: 0; }
  80%, 100% { opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .f06 .f06-cells i { opacity: 1; } }
</style>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  while (root && !root.classList.contains("stage")) root = root.previousElementSibling;
  if (!root) return;
  var host = root.querySelector(".f06-cells");
  if (!host || host.childElementCount) return;
  /* One cell is 15.9% x 25.4% of the scene -- about six across the 85 mm
     face. Filled diamonds sit a full cell apart and touch the unfilled
     alternates at their vertices. The ragged front is a per-cell threshold,
     not a gradient: the staircase is what the real dissolve looks like. */
  var W = 15.9, H = 25.4, out = [];
  for (var r = -1; r < 6; r++) {
    for (var c = -1; c < 9; c++) {
      var keep = 1.0 - (c / 8.0) * 1.34 + ((r * 7 + c * 11) % 5) * 0.075;
      if (keep < 0.4) continue;
      var edge = keep < 0.62;
      out.push('<i style="left:' + (c * W - W / 2).toFixed(2) + '%;top:' +
        (r * H - H / 2).toFixed(2) + '%;width:' + W + '%;height:' + H + '%;' +
        'animation-delay:' + (((r * 3 + c * 5) % 9) * -0.62).toFixed(2) + 's;' +
        (edge ? '' : 'animation:none;') + '"></i>');
    }
  }
  host.innerHTML = out.join("");
})();
</script>
