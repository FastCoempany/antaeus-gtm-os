<style>
/* The page chrome (brief section 9). One family, no accent, radii 0 except the
   button, no cards, no borders around sections, no dividers. Space and scale
   do the separating. */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--chrome-ground); color: var(--chrome-text); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  font-family: var(--chrome-font);
  font-size: var(--chrome-body);
  line-height: var(--chrome-body-lh);
  font-weight: 400;
  letter-spacing: 0;
  --gutter: clamp(20px, 5vw, 72px);
  --section: var(--chrome-section);
}
h1, h2, h3, p, figure, ol, ul { margin: 0; }
a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--chrome-text); outline-offset: 3px; }
::selection { background: var(--chrome-text); color: var(--chrome-ground); }

.wordmark { font-weight: 700; font-size: var(--chrome-wordmark); line-height: 1; letter-spacing: var(--chrome-track-display); }
/* Brief 9 pins the wordmark at 120 in a hero treatment; at 768 the word (678px) still fits the 691px between the gutters. */
.hero .wordmark { font-size: 120px; }
.slogan { font-weight: 600; font-size: var(--chrome-slogan); line-height: var(--chrome-slogan-lh); letter-spacing: var(--chrome-track-display); max-width: 30ch; text-wrap: balance; }
.subline { font-size: var(--chrome-sub); line-height: var(--chrome-sub-lh); max-width: var(--chrome-measure); }
h2 { font-weight: 600; font-size: var(--chrome-h2); line-height: var(--chrome-h2-lh); letter-spacing: var(--chrome-track-display); }
h3 { font-weight: 600; font-size: var(--chrome-body); line-height: var(--chrome-body-lh); }
.caption { font-weight: 600; font-size: var(--chrome-caption); line-height: var(--chrome-caption-lh); letter-spacing: var(--chrome-track-display); }
.source { color: var(--chrome-text-2); font-size: var(--chrome-body); line-height: var(--chrome-body-lh); }
.source a { text-decoration: none; }
.source a:hover { text-decoration: underline; }
.gallery-intro { font-size: var(--chrome-sub); line-height: var(--chrome-sub-lh); max-width: var(--chrome-measure); }
.section { padding: var(--section) var(--gutter); }
/* The measure holds whatever wrapper a variant puts the how and offer partials in. */
.section p, .section li p, .how p, .offer p { max-width: var(--chrome-measure); }

.button {
  display: inline-block;
  background: var(--chrome-button-bg);
  color: var(--chrome-button-fg);
  border: 0;
  border-radius: var(--chrome-button-radius);
  padding: 14px 22px;
  font: inherit;
  font-weight: 600;
  font-size: 15px;
  line-height: 20px;
  text-decoration: none;
  cursor: pointer;
}
.button:hover { background: #ffffff; }

/* Hero copy block, shared shape; variants place it. */
.hero-copy { display: grid; gap: 24px; justify-items: start; min-width: 0; }
.hero-copy .button { margin-top: 8px; }

/* How it works: a sequence, so the numbers are allowed. They sit inline at the
   heading's own size and color (rule-10 review, DESIGN.md): not a big grey step number. */
.steps { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; margin-top: 48px; }
.steps li { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 16px; align-items: start; }
.step-n { font-weight: 600; font-size: var(--chrome-body); line-height: var(--chrome-body-lh); color: var(--chrome-text); }
.steps h3 { margin-bottom: 4px; }
.steps p { color: var(--chrome-text); max-width: 30ch; text-wrap: pretty; }

/* The offer. */
.offer-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 48px; }
.offer-cols h2 { margin-bottom: 16px; }
.price { margin-top: 48px; font-size: var(--chrome-sub); line-height: var(--chrome-sub-lh); }

/* The form. */
.idea-form { display: grid; gap: 24px; max-width: 560px; margin-top: 40px; }
.field label { display: block; font-weight: 600; margin-bottom: 8px; }
.field input, .field textarea {
  display: block;
  width: 100%;
  background: var(--chrome-ground);
  color: var(--chrome-text);
  border: 1px solid var(--chrome-text-2);
  border-radius: 0;
  padding: 12px 14px;
  font: inherit;
  line-height: 24px;
}
.field textarea { resize: vertical; min-height: 96px; }
.field input::placeholder, .field textarea::placeholder { color: var(--chrome-text-2); opacity: 1; }
.field input:focus, .field textarea:focus { outline: 2px solid var(--chrome-text); outline-offset: -1px; border-color: transparent; }
.field[data-invalid="true"] input, .field[data-invalid="true"] textarea { border-color: var(--chrome-text); }
.field-error { margin-top: 8px; }
.field-error:empty { display: none; }
.idea-form .button { justify-self: start; }
.sent { display: grid; gap: 24px; justify-items: start; margin-top: 40px; max-width: var(--chrome-measure); }
.sent p { font-size: var(--chrome-sub); line-height: var(--chrome-sub-lh); }

/* Footer. */
.foot { padding: var(--section) var(--gutter) 64px; color: var(--chrome-text-2); }
.foot a { text-decoration: none; }
.foot a:hover { text-decoration: underline; }

@media (max-width: 1023px) {
  .steps { grid-template-columns: 1fr; gap: 24px; }
}
@media (max-width: 767px) {
  body { --section: var(--chrome-section-m); }
  .slogan { font-size: var(--chrome-slogan-m); line-height: var(--chrome-slogan-m-lh); }
  .hero .wordmark { font-size: clamp(48px, 13vw, 64px); }
  .offer-cols { grid-template-columns: 1fr; gap: 32px; }
}
@media (prefers-reduced-motion: reduce) {
  html:not(.stage) *, html:not(.stage) *::before, html:not(.stage) *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>
