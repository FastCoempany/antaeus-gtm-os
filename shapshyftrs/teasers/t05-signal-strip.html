<!-- teaser id=signal-strip num=5 source=gtmos focal=38%,48% loop=9 interactive=no -->
<div class="stage t05" data-teaser="signal-strip" style="--fx:0.38;--fy:0.48" role="img" aria-label="A row of seven phase chips over a thin waveform, lighting in order; one earlier chip is re-scored coral and the score numeral ticks up">

</div>
<style>
/* the rig: perspective, then one tilted plane holding the head, the glass strip and the chip layer at three depths.

/* the strip: one long glass panel, lit from its upper left, the waveform in its lower band */
.t05 .t05-panel { position: absolute; left: 0; top: calc(12 * var(--u)); width: 100%; height: calc(27 * var(--u)); overflow: hidden; border-radius: calc(1 * var(--u)); border: calc(0.0625 * var(--u)) solid var(--gtm-glass-border); background: radial-gradient(ellipse 58% 95% at 14% 0%, rgba(255, 255, 255, 0.12), transparent 62%), var(--gtm-glass-fill); box-shadow: var(--gtm-inner-highlight); -webkit-backdrop-filter: blur(var(--gtm-glass-blur)); backdrop-filter: blur(var(--gtm-glass-blur)); }
@supports not (backdrop-filter: blur(1px)) { .t05 .t05-panel { background: radial-gradient(ellipse 58% 95% at 14% 0%, rgba(255, 255, 255, 0.12), transparent 62%), var(--gtm-glass-fallback); } }
/* skewX slants x only, so the sweep needs no vertical overshoot: the band is exactly the panel's height */
.t05 .t05-spec { position: absolute; top: 0; left: calc(-30 * var(--u)); width: calc(30 * var(--u)); height: 100%; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.09) 44%, rgba(255, 255, 255, 0.045) 58%, transparent); transform: skewX(-22deg) translateX(calc(46 * var(--u))); will-change: transform; animation: t05-spec var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-play { position: absolute; left: var(--pad); top: calc(1.2 * var(--u)); width: calc(0.125 * var(--u)); height: calc(24.6 * var(--u)); background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.55) 30%, rgba(255, 255, 255, 0.55) 70%, transparent); opacity: 0; will-change: transform, opacity; animation: t05-play var(--gtm-loop-default) linear infinite; }

.t05 .t05-hotwave { animation: t05-hot var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-hotglow { fill: none; stroke: var(--gtm-accent); stroke-opacity: 0.2; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }

.t05 .t05-chips { position: absolute; left: var(--pad); top: calc(14.5 * var(--u)); width: calc(100% - 2 * var(--pad)); height: calc(8 * var(--u)); display: grid; grid-template-columns: repeat(7, 1fr); gap: calc(0.6 * var(--u)); transform-style: preserve-3d; transform: translateZ(calc(1.2 * var(--u))); }
.t05 .t05-chip { position: relative; }
.t05 .t05-c3 { transform: translateZ(calc(1.2 * var(--u))); will-change: transform; animation: t05-lift var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-face { position: absolute; inset: 0; border-radius: calc(0.625 * var(--u)); border: calc(0.0625 * var(--u)) solid var(--gtm-border); border-left-width: calc(0.1875 * var(--u)); border-left-color: rgba(255, 255, 255, 0.14); background: var(--gtm-fill-faint); }
.t05 .t05-on { border-color: var(--gtm-chip-stroke); border-left-color: var(--gtm-text-2); background: var(--gtm-highlight-top), var(--gtm-glass-fill); box-shadow: var(--gtm-inner-highlight); will-change: opacity, transform; }
.t05 .t05-hot { border-color: rgba(255, 107, 107, 0.6); border-left-color: var(--gtm-accent); background: linear-gradient(180deg, rgba(255, 107, 107, 0.24), rgba(255, 107, 107, 0.08)), var(--gtm-raised); box-shadow: var(--gtm-inner-highlight), 0 0 calc(1.5 * var(--u)) var(--gtm-accent-glow); will-change: opacity; animation: t05-hot var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-ord { position: absolute; left: calc(1.15 * var(--u)); top: calc(1 * var(--u)); font-family: var(--gtm-font-data); font-weight: var(--gtm-weight-data); font-size: calc(0.72 * var(--u)); line-height: 1; letter-spacing: 0.1em; color: var(--gtm-text-muted); opacity: 0.7; }
.t05 .t05-lab { position: absolute; left: calc(1.15 * var(--u)); right: calc(0.8 * var(--u)); top: calc(2.55 * var(--u)); font-family: var(--gtm-font-ui); font-weight: var(--gtm-weight-ui-strong); font-size: calc(1.02 * var(--u)); line-height: 1.25; letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; color: var(--gtm-text-muted); }
.t05 .t05-bar { position: absolute; left: calc(1.15 * var(--u)); bottom: calc(1.1 * var(--u)); width: calc(3.2 * var(--u)); height: calc(0.32 * var(--u)); border-radius: var(--gtm-radius-full); background: var(--gtm-bar-track); overflow: hidden; }
.t05 .t05-bar i { display: block; height: 100%; width: var(--w, 0%); border-radius: inherit; background: linear-gradient(90deg, var(--gtm-state-amber), var(--gtm-accent)); }
.t05 .t05-on .t05-ord { color: var(--gtm-text-3); opacity: 1; }
.t05 .t05-on .t05-lab { color: var(--gtm-text-2); }
.t05 .t05-hot .t05-ord { color: var(--gtm-accent); opacity: 1; }
.t05 .t05-hot .t05-lab { color: var(--gtm-text); }
.t05 .t05-hot .t05-bar { background: rgba(255, 107, 107, 0.16); }
/* the loop, 9s. 0–7% rest; 7–17% the read withdraws; 21–79% the trace draws left to right and each chip lights as the head passes;
   at the sixth chip the score brightens, then the third chip flips coral and the numeral rolls 58 to 74; the seventh lights; 81–100% rest again */
@keyframes t05-draw { 0%, 7% { stroke-dashoffset: 0; } 17%, 21% { stroke-dashoffset: 1; animation-timing-function: linear; } 79%, 100% { stroke-dashoffset: 0; } }
@keyframes t05-play { 0%, 19% { opacity: 0; transform: translateX(0); animation-timing-function: linear; } 21% { opacity: 1; transform: translateX(0); animation-timing-function: linear; } 79% { opacity: 1; transform: translateX(calc(72 * var(--u))); animation-timing-function: linear; } 81%, 100% { opacity: 0; transform: translateX(calc(72 * var(--u))); } }
@keyframes t05-spec { 0%, 7% { transform: skewX(-22deg) translateX(calc(46 * var(--u))); } 17% { transform: skewX(-22deg) translateX(calc(132 * var(--u))); animation-timing-function: steps(1, end); } 21% { transform: skewX(-22deg) translateX(calc(-52 * var(--u))); animation-timing-function: linear; } 100% { transform: skewX(-22deg) translateX(calc(46 * var(--u))); } }
@keyframes t05-num { 0%, 7% { opacity: 1; } 15% { opacity: 0.1; } 21%, 66.5% { opacity: 0.3; } 70%, 100% { opacity: 1; } }
@keyframes t05-tens { 0%, 8% { transform: translateY(-2em); } 15%, 71.5% { transform: translateY(0); } 77.5%, 100% { transform: translateY(-2em); } }
@keyframes t05-ones { 0%, 8% { transform: translateY(-6em); } 15%, 71.5% { transform: translateY(0); } 77.5%, 100% { transform: translateY(-6em); } }
@keyframes t05-hot { 0%, 7% { opacity: 1; } 17%, 71% { opacity: 0; } 76.5%, 100% { opacity: 1; } }
@keyframes t05-lift { 0%, 7% { transform: translateZ(calc(1.2 * var(--u))); } 17%, 71% { transform: translateZ(0); } 76.5%, 100% { transform: translateZ(calc(1.2 * var(--u))); } }
@keyframes t05-on-1 { 0%, 7% { opacity: 1; transform: none; } 17%, 25% { opacity: 0; transform: translateY(calc(0.35 * var(--u))); } 30.5%, 100% { opacity: 1; transform: none; } }
@keyframes t05-on-2 { 0%, 7% { opacity: 1; transform: none; } 17%, 33.5% { opacity: 0; transform: translateY(calc(0.35 * var(--u))); } 39%, 100% { opacity: 1; transform: none; } }
@keyframes t05-on-3 { 0%, 7% { opacity: 1; transform: none; } 17%, 41.5% { opacity: 0; transform: translateY(calc(0.35 * var(--u))); } 47%, 100% { opacity: 1; transform: none; } }
@keyframes t05-on-4 { 0%, 7% { opacity: 1; transform: none; } 17%, 50% { opacity: 0; transform: translateY(calc(0.35 * var(--u))); } 55.5%, 100% { opacity: 1; transform: none; } }
@keyframes t05-on-5 { 0%, 7% { opacity: 1; transform: none; } 17%, 58.5% { opacity: 0; transform: translateY(calc(0.35 * var(--u))); } 64%, 100% { opacity: 1; transform: none; } }
@keyframes t05-on-6 { 0%, 7% { opacity: 1; transform: none; } 17%, 66.5% { opacity: 0; transform: translateY(calc(0.35 * var(--u))); } 72%, 100% { opacity: 1; transform: none; } }
@keyframes t05-on-7 { 0%, 7% { opacity: 1; transform: none; } 17%, 75% { opacity: 0; transform: translateY(calc(0.35 * var(--u))); } 80.5%, 100% { opacity: 1; transform: none; } }
.t05 .t05-c1 .t05-on { animation: t05-on-1 var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-c2 .t05-on { animation: t05-on-2 var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-c3 .t05-on { animation: t05-on-3 var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-c4 .t05-on { animation: t05-on-4 var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-c5 .t05-on { animation: t05-on-5 var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-c6 .t05-on { animation: t05-on-6 var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
.t05 .t05-c7 .t05-on { animation: t05-on-7 var(--gtm-loop-default) var(--gtm-loop-ease) infinite; }
</style>
<script>
(function () {
  var LABELS = ["Opening", "What changed", "Who owns it", "Timing", "Budget", "Process", "Next step"];
  var FILL = [58, 42, 34, 66, 50, 76, 60];
  var HOT = 2, HOT_FILL = 92;
  var W = 750, MID = 60, STEP = 1.5;
  /* the waveform's viewBox spans the same row the chips do, so the chip pitch is read off the row itself */
  var COLS = 7, ROW_U = 72, GAP_U = 0.6, COL_U = (ROW_U - GAP_U * (COLS - 1)) / COLS;
  var CHIP = (COL_U + GAP_U) * (W / ROW_U), CHIP_W = COL_U * (W / ROW_U);
  var hotX0 = HOT * CHIP, hotX1 = hotX0 + CHIP_W, hotC = (hotX0 + hotX1) / 2;
  var NS = "http://www.w3.org/2000/svg";
  function y(x) {
    var t = x / W;
    var env = 0.16 + 0.84 * Math.pow(t, 1.35);
    var bump = 0.72 * Math.exp(-Math.pow((x - hotC) / 26, 2));
    var v = Math.sin(x * 0.21 + 0.6) * (0.55 + 0.45 * Math.sin(x * 0.037))
          + 0.32 * Math.sin(x * 0.53 + 1.9) * Math.sin(x * 0.011 + 0.4);
    var yy = MID - (env + bump) * v * 40;
    return Math.max(4, Math.min(116, yy));
  }
  function seg(x0, x1) {
    var d = "";
    for (var x = x0; x <= x1 + 1e-6; x += STEP) d += (d ? " L" : "M") + x.toFixed(1) + " " + y(x).toFixed(1);
    return d;
  }
  function el(tag, cls, attrs) {
    var e = document.createElementNS(NS, tag);
    if (cls) e.setAttribute("class", cls);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function face(kind, i, fill) {
    var f = document.createElement("span");
    f.className = "t05-face " + kind;
    var o = document.createElement("span"); o.className = "t05-ord"; o.textContent = "0" + (i + 1);
    var l = document.createElement("span"); l.className = "t05-lab"; l.textContent = LABELS[i];
    var b = document.createElement("span"); b.className = "t05-bar";
    if (fill) { var fi = document.createElement("i"); fi.style.setProperty("--w", fill + "%"); b.appendChild(fi); }
    f.appendChild(o); f.appendChild(l); f.appendChild(b);
    return f;
  }
  var roots = document.querySelectorAll(".stage.t05");
  Array.prototype.forEach.call(roots, function (root) {
    if (root.dataset.ready) return;
    root.dataset.ready = "1";
    var chips = root.querySelector(".t05-chips");
    for (var i = 0; i < 7; i++) {
      var c = document.createElement("div");
      c.className = "t05-chip t05-c" + (i + 1);
      c.appendChild(face("t05-off", i, 0));
      c.appendChild(face("t05-on", i, FILL[i]));
      if (i === HOT) c.appendChild(face("t05-hot", i, HOT_FILL));
      chips.appendChild(c);
    }
    var svg = root.querySelector(".t05-wave");
    var full = seg(0, W);
    svg.appendChild(el("line", "t05-base", { x1: 0, y1: MID, x2: W, y2: MID }));
    svg.appendChild(el("path", "t05-ghost", { d: full }));
    svg.appendChild(el("path", "t05-line", { d: full, pathLength: 1 }));
    var g = el("g", "t05-hotwave", {});
    g.appendChild(el("path", "t05-hotglow", { d: seg(hotX0, hotX1) }));
    g.appendChild(el("path", "t05-hotline", { d: seg(hotX0, hotX1) }));
    svg.appendChild(g);
    /* the loop is CSS; the runtime's is-playing class starts and pauses it */
  });
})();
</script>
