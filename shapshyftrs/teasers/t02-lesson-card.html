<!-- teaser id=lesson-card num=2 source=aesdr focal=42%,50% loop=8 interactive=yes -->
<div class="stage t02" data-teaser="lesson-card" style="--fx:0.42;--fy:0.5" role="group" aria-label="A lesson card that turns to the next lesson">
  <div class="stage-frame"><div class="stage-scene">
    <div class="t02-deck">
      <div class="t02-card t02-back" aria-hidden="true"></div>
      <div class="t02-card t02-next" aria-hidden="true">
        <span class="t02-kicker">Lesson 04</span>
        <span class="t02-num">04</span>
        <span class="t02-title">Ask what changed</span>
        <span class="t02-body">Every buyer has a reason to talk today that they did not have last month. Find it before you say a word about yourself.</span>
        <span class="t02-foot"><span class="t02-count">04 / 07</span><span class="t02-track"><span class="t02-fill t02-fill-next"><i></i></span></span></span>
      </div>
      <button class="t02-card t02-front" type="button" aria-label="Turn the page to the next lesson">
        <span class="t02-kicker">Lesson 03</span>
        <span class="t02-num">03</span>
        <span class="t02-title">Opening the call</span>
        <span class="t02-body">Say who you are and why you are calling in one breath. Then stop, and let the quiet do the asking.</span>
        <span class="t02-foot"><span class="t02-count">03 / 07</span><span class="t02-track"><span class="t02-fill"><i></i></span></span></span>
        <span class="t02-ear"></span>
      </button>
    </div>
  </div></div>
</div>
<style>
.t02 .t02-deck { position: absolute; left: 15%; top: 16%; width: 70%; height: 68%; perspective: calc(130 * var(--u)); }
.t02 .t02-card {
  position: absolute; inset: 0; margin: 0; padding: calc(3.2 * var(--u)) calc(3.6 * var(--u));
  background: var(--aes-paper); color: var(--aes-ink);
  border: calc(0.0625 * var(--u)) solid var(--aes-light); border-radius: 0;
  font-family: var(--aes-font-body); text-align: left; display: block; overflow: hidden;
  transform-origin: left center; backface-visibility: hidden;
}
.t02 .t02-back { transform: translateY(calc(0.5 * var(--u))) rotate(0.6deg); }
.t02 .t02-next { transform: translateY(calc(0.25 * var(--u))) rotate(0.3deg); }
.t02 .t02-front { cursor: pointer; clip-path: polygon(0 0, calc(100% - 3.4 * var(--u)) 0, 100% calc(3.4 * var(--u)), 100% 100%, 0 100%); }
.t02 .t02-front:focus-visible { outline: 2px solid #F4F4F0; outline-offset: 4px; }
.t02 .t02-kicker { position: absolute; left: calc(3.6 * var(--u)); top: calc(3 * var(--u)); font-family: var(--aes-font-mono); font-size: calc(1 * var(--u)); letter-spacing: 0.22em; text-transform: uppercase; color: var(--aes-muted); }
.t02 .t02-num { position: absolute; right: calc(6 * var(--u)); top: calc(1.6 * var(--u)); font-family: var(--aes-font-label); font-weight: 600; font-size: calc(6.4 * var(--u)); line-height: 1; color: var(--aes-ink); opacity: 0.1; }
.t02 .t02-title { display: block; margin-top: calc(11 * var(--u)); font-family: var(--aes-font-display); font-weight: 400; font-size: calc(3.9 * var(--u)); line-height: 1.05; letter-spacing: -0.01em; color: var(--aes-ink); }
.t02 .t02-body { display: block; margin-top: calc(1.8 * var(--u)); max-width: calc(42 * var(--u)); font-family: var(--aes-font-body); font-weight: 400; font-size: calc(2.05 * var(--u)); line-height: 1.5; color: var(--aes-ink); }
.t02 .t02-foot { position: absolute; left: calc(3.6 * var(--u)); right: calc(3.6 * var(--u)); bottom: calc(3 * var(--u)); display: flex; align-items: center; justify-content: space-between; padding-top: calc(1.4 * var(--u)); border-top: calc(0.0625 * var(--u)) solid var(--aes-light); }
.t02 .t02-count { font-family: var(--aes-font-mono); font-size: calc(1 * var(--u)); letter-spacing: 0.2em; color: var(--aes-muted); }
.t02 .t02-track { position: relative; width: calc(16 * var(--u)); height: calc(0.125 * var(--u)); background: var(--aes-light-2); overflow: hidden; }
.t02 .t02-fill { position: absolute; inset: 0; transform-origin: left center; transform: scaleX(0.4286); overflow: hidden; }
.t02 .t02-fill-next { transform: scaleX(0.5714); }
.t02 .t02-fill i { position: absolute; top: 0; bottom: 0; left: 0; width: 300%; background: var(--aes-iris); animation: t02-shimmer 6s linear infinite; will-change: transform; }
.t02 .t02-ear { position: absolute; right: 0; top: 0; width: calc(3.4 * var(--u)); height: calc(3.4 * var(--u)); background: var(--aes-paper-fold); clip-path: polygon(0 0, 100% 100%, 0 100%); transform-origin: 0% 100%; animation: t02-ear 8s ease-in-out infinite; }
.t02 .t02-front { animation: t02-turn 8s cubic-bezier(.7, 0, .2, 1) infinite; will-change: transform, opacity; }
.t02 .t02-fill-next { animation: t02-step 8s cubic-bezier(.4, 0, .2, 1) infinite; }
@keyframes t02-turn {
  0%, 34% { transform: rotateY(0deg) translateX(0); opacity: 1; }
  44% { transform: rotateY(-150deg) translateX(-8%); opacity: 0; }
  88% { transform: rotateY(-150deg) translateX(-8%); opacity: 0; }
  88.1% { transform: rotateY(0deg) translateX(0); opacity: 0; }
  96%, 100% { transform: rotateY(0deg) translateX(0); opacity: 1; }
}
@keyframes t02-ear { 0%, 24% { transform: scale(1); } 32%, 100% { transform: scale(1.5); } }
@keyframes t02-step { 0%, 40% { transform: scaleX(0.4286); } 50%, 90% { transform: scaleX(0.5714); } 97%, 100% { transform: scaleX(0.4286); } }
@keyframes t02-shimmer { from { transform: translateX(0); } to { transform: translateX(-66.66%); } }
/* Pointer or keyboard: the same turn, then the loop resumes from rest. */
.t02 .t02-deck.is-manual .t02-front, .t02 .t02-deck.is-manual .t02-fill-next, .t02 .t02-deck.is-manual .t02-ear { animation: none; }
.t02 .t02-deck.is-manual .t02-front { transition: transform 650ms cubic-bezier(.7, 0, .2, 1), opacity 450ms ease; }
.t02 .t02-deck.is-manual .t02-fill-next { transition: transform 800ms cubic-bezier(.4, 0, .2, 1); transform: scaleX(0.4286); }
.t02 .t02-deck.is-manual.is-flipped .t02-front { transform: rotateY(-150deg) translateX(-8%); opacity: 0; }
.t02 .t02-deck.is-manual.is-flipped .t02-fill-next { transform: scaleX(0.5714); }
</style>
<script>
(function () {
  var roots = document.querySelectorAll(".stage.t02");
  Array.prototype.forEach.call(roots, function (root) {
    if (root.dataset.ready) return;
    root.dataset.ready = "1";
    var deck = root.querySelector(".t02-deck");
    var front = root.querySelector(".t02-front");
    var timer1 = null, timer2 = null;
    function turn() {
      clearTimeout(timer1); clearTimeout(timer2);
      deck.classList.add("is-manual");
      void deck.offsetWidth;
      deck.classList.add("is-flipped");
      timer1 = setTimeout(function () {
        deck.classList.remove("is-flipped");
        timer2 = setTimeout(function () { deck.classList.remove("is-manual"); }, 720);
      }, 2400);
    }
    front.addEventListener("click", turn);
    front.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); turn(); } });
  });
})();
</script>
