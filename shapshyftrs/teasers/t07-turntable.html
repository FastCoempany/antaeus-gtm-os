<!-- teaser id=turntable num=7 source=nrdi-puff-junction focal=50%,50% loop=8 interactive=no -->
<div class="stage t07" data-teaser="turntable" style="--fx:0.5;--fy:0.5" role="img" aria-label="A concrete and brass grinder turning slowly on a turntable">
  <div class="stage-frame"><div class="stage-scene">
    <canvas class="t07-canvas" aria-hidden="true"></canvas>
    <div class="t07-mark" aria-hidden="true"><span class="t07-puff">puff</span><span class="t07-junction">Junction</span></div>
  </div></div>
</div>
<style>
.t07 .t07-canvas { position: absolute; left: 20%; top: 8%; width: 60%; height: 76%; display: block; }
.t07 .t07-mark { position: absolute; left: 50%; top: 86%; transform: translateX(-50%); display: grid; justify-items: end; color: var(--npj-slime); line-height: 1; }
.t07 .t07-puff { font-family: var(--npj-font-display); font-stretch: 120%; font-style: italic; font-weight: 900; font-size: calc(2.2 * var(--u)); letter-spacing: -0.02em; }
.t07 .t07-junction { font-family: var(--npj-font-display); font-stretch: 120%; font-style: italic; font-weight: 700; font-size: calc(0.72 * var(--u)); letter-spacing: 0.25em; text-transform: uppercase; margin-top: calc(0.2 * var(--u)); margin-right: calc(0.1 * var(--u)); }
</style>
<script>
(function () {
  var roots = document.querySelectorAll(".stage.t07");
  Array.prototype.forEach.call(roots, function (root) {
    if (root.dataset.ready) return;
    root.dataset.ready = "1";
    var canvas = root.querySelector(".t07-canvas");
    var ctx = canvas.getContext("2d");
    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
    var W = 0, H = 0, dpr = 1, raf = 0, playing = false, t0 = 0, last = 0, theta = Math.PI / 6;
    var PERIOD = 8000;
    var PHI = 22 * Math.PI / 180, SINP = Math.sin(PHI), COSP = Math.cos(PHI);
    var L = norm([-0.55, 0.85, 0.55]);
    function norm(v) { var m = Math.hypot(v[0], v[1], v[2]); return [v[0] / m, v[1] / m, v[2] / m]; }
    function dot(a, b) { return a[0] * b[0] + a[1] * b[1] + a[2] * b[2]; }
    var knurl = document.createElement("canvas");
    (function () {
      knurl.width = 12; knurl.height = 14;
      var k = knurl.getContext("2d");
      k.strokeStyle = "rgba(60,38,14,0.55)"; k.lineWidth = 1.2;
      k.beginPath(); k.moveTo(0, 0); k.lineTo(12, 14); k.moveTo(0, 14); k.lineTo(12, 0); k.moveTo(-6, 7); k.lineTo(6, 21); k.moveTo(6, -7); k.lineTo(18, 7); k.stroke();
      k.strokeStyle = "rgba(255,236,190,0.28)"; k.lineWidth = 0.8;
      k.beginPath(); k.moveTo(1, 0); k.lineTo(13, 14); k.moveTo(1, 14); k.lineTo(13, 0); k.stroke();
    })();
    var grain = document.createElement("canvas");
    (function () {
      grain.width = 64; grain.height = 64;
      var g = grain.getContext("2d");
      var seed = 7;
      function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
      for (var i = 0; i < 520; i++) {
        var x = Math.floor(rnd() * 64), y = Math.floor(rnd() * 64);
        g.fillStyle = (rnd() < 0.35) ? "rgba(255,255,255,0.07)" : "rgba(0,0,0,0.11)";
        g.fillRect(x, y, 1, 1);
      }
    })();
    function resize() {
      var r = canvas.getBoundingClientRect();
      dpr = Math.min(2, window.devicePixelRatio || 1);
      W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw(theta);
    }
    function rot(p, th) { var c = Math.cos(th), s = Math.sin(th); return [p[0] * c + p[2] * s, p[1], -p[0] * s + p[2] * c]; }
    function proj(p, S, cx, cy) { return [cx + p[0] * S, cy - p[1] * S * COSP + p[2] * S * SINP]; }
    function shade(hex, n) {
      var b = 0.30 + 0.70 * Math.max(0, dot(n, L));
      var r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), bl = parseInt(hex.slice(5, 7), 16);
      return "rgb(" + Math.round(r * b) + "," + Math.round(g * b) + "," + Math.round(bl * b) + ")";
    }
    function draw(th) {
      ctx.clearRect(0, 0, W, H);
      var S = Math.min(W * 0.62, H * 0.86) * 1.0;
      var cx = W / 2, cy = H * 0.66;
      var Wb = 1, Hb = 0.49, hw = Wb / 2;
      /* light pool on the floor */
      var pool = ctx.createRadialGradient(cx, cy + S * 0.02, S * 0.05, cx, cy + S * 0.02, S * 0.78);
      pool.addColorStop(0, "rgba(255,255,255,0.10)"); pool.addColorStop(1, "rgba(255,255,255,0)");
      ctx.save(); ctx.scale(1, 0.42); ctx.fillStyle = pool; ctx.fillRect(0, 0, W, H / 0.42); ctx.restore();
      /* block faces */
      var corners = [[-hw, 0, -hw], [hw, 0, -hw], [hw, 0, hw], [-hw, 0, hw]];
      var faces = [
        { idx: [0, 1], n: [0, 0, -1] }, { idx: [1, 2], n: [1, 0, 0] }, { idx: [2, 3], n: [0, 0, 1] }, { idx: [3, 0], n: [-1, 0, 0] }
      ];
      var view = [0, SINP, COSP];
      faces.forEach(function (f) {
        var n = rot(f.n, th);
        if (dot(n, view) <= 0) return;
        var a = rot(corners[f.idx[0]], th), b = rot(corners[f.idx[1]], th);
        var a0 = proj(a, S, cx, cy), b0 = proj(b, S, cx, cy), a1 = proj([a[0], Hb, a[2]], S, cx, cy), b1 = proj([b[0], Hb, b[2]], S, cx, cy);
        ctx.beginPath(); ctx.moveTo(a0[0], a0[1]); ctx.lineTo(b0[0], b0[1]); ctx.lineTo(b1[0], b1[1]); ctx.lineTo(a1[0], a1[1]); ctx.closePath();
        ctx.fillStyle = shade("#6A6A6A", n); ctx.fill();
        ctx.save(); ctx.clip(); ctx.globalAlpha = 0.9; ctx.fillStyle = ctx.createPattern(grain, "repeat"); ctx.fillRect(0, 0, W, H); ctx.restore();
        /* seam at mid height */
        var am = proj([a[0], Hb / 2, a[2]], S, cx, cy), bm = proj([b[0], Hb / 2, b[2]], S, cx, cy);
        ctx.beginPath(); ctx.moveTo(am[0], am[1]); ctx.lineTo(bm[0], bm[1]); ctx.strokeStyle = "rgba(0,0,0,0.55)"; ctx.lineWidth = Math.max(1, S * 0.004); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(am[0], am[1] + S * 0.004); ctx.lineTo(bm[0], bm[1] + S * 0.004); ctx.strokeStyle = "rgba(255,255,255,0.08)"; ctx.lineWidth = 1; ctx.stroke();
        /* vertical edge light */
        ctx.beginPath(); ctx.moveTo(b0[0], b0[1]); ctx.lineTo(b1[0], b1[1]); ctx.strokeStyle = "rgba(255,255,255," + (0.05 + 0.12 * Math.max(0, dot(n, L))) + ")"; ctx.lineWidth = 1; ctx.stroke();
      });
      /* top face */
      var top = corners.map(function (c) { return proj(rot([c[0], Hb, c[2]], th), S, cx, cy); });
      ctx.beginPath(); ctx.moveTo(top[0][0], top[0][1]); for (var i = 1; i < 4; i++) ctx.lineTo(top[i][0], top[i][1]); ctx.closePath();
      ctx.fillStyle = shade("#7A7A7A", [0, 1, 0]); ctx.fill();
      ctx.save(); ctx.clip(); ctx.globalAlpha = 0.9; ctx.fillStyle = ctx.createPattern(grain, "repeat"); ctx.fillRect(0, 0, W, H); ctx.restore();
      ctx.strokeStyle = "rgba(255,255,255,0.16)"; ctx.lineWidth = 1; ctx.stroke();
      /* cap: flange lip, knurled drum, chamfer, top */
      function ell(y, r) { var c = proj([0, y, 0], S, cx, cy); return { x: c[0], y: c[1], rx: r * S, ry: r * S * SINP }; }
      function ellipsePath(e, front) {
        ctx.beginPath(); ctx.ellipse(e.x, e.y, e.rx, e.ry, 0, 0, Math.PI * 2);
      }
      var lip = ell(Hb + 0.02, 0.37), lipB = ell(Hb, 0.37);
      var drumB = ell(Hb + 0.02, 0.325), drumT = ell(Hb + 0.14, 0.325);
      var chT = ell(Hb + 0.164, 0.30);
      function cylinderSide(b, t, base, hi, lo) {
        ctx.beginPath();
        ctx.moveTo(b.x - b.rx, b.y); ctx.ellipse(b.x, b.y, b.rx, b.ry, 0, Math.PI, 0, true);
        ctx.lineTo(t.x + t.rx, t.y); ctx.ellipse(t.x, t.y, t.rx, t.ry, 0, 0, Math.PI, false); ctx.closePath();
        var g = ctx.createLinearGradient(b.x - b.rx, 0, b.x + b.rx, 0);
        g.addColorStop(0, lo); g.addColorStop(0.32, hi); g.addColorStop(0.62, base); g.addColorStop(1, lo);
        ctx.fillStyle = g; ctx.fill();
      }
      cylinderSide(lipB, lip, "#B08D57", "#D9BE86", "#5A3E1B");
      cylinderSide(drumB, drumT, "#9A7434", "#D6B36A", "#4A3216");
      ctx.save();
      ctx.beginPath(); ctx.moveTo(drumB.x - drumB.rx, drumB.y); ctx.ellipse(drumB.x, drumB.y, drumB.rx, drumB.ry, 0, Math.PI, 0, true); ctx.lineTo(drumT.x + drumT.rx, drumT.y); ctx.ellipse(drumT.x, drumT.y, drumT.rx, drumT.ry, 0, 0, Math.PI, false); ctx.closePath(); ctx.clip();
      var pat = ctx.createPattern(knurl, "repeat");
      var shift = ((th * 0.325 * S) % 12);
      ctx.translate(shift, 0); ctx.fillStyle = pat; ctx.globalAlpha = 0.85; ctx.fillRect(-24, 0, W + 48, H);
      ctx.restore();
      /* chamfer ring: bright band */
      ctx.beginPath(); ctx.ellipse(drumT.x, drumT.y, drumT.rx, drumT.ry, 0, 0, Math.PI * 2);
      var cg = ctx.createLinearGradient(drumT.x - drumT.rx, 0, drumT.x + drumT.rx, 0);
      cg.addColorStop(0, "#7A5A2A"); cg.addColorStop(0.3, "#F6EDD8"); cg.addColorStop(0.6, "#C9A45C"); cg.addColorStop(1, "#6E4E22");
      ctx.fillStyle = cg; ctx.fill();
      /* flat top, brushed */
      ctx.beginPath(); ctx.ellipse(chT.x, chT.y, chT.rx, chT.ry, 0, 0, Math.PI * 2);
      var tg = ctx.createRadialGradient(chT.x - chT.rx * 0.35, chT.y - chT.ry * 0.5, 0, chT.x, chT.y, chT.rx * 1.1);
      tg.addColorStop(0, "#E3CFA0"); tg.addColorStop(0.6, "#B08D57"); tg.addColorStop(1, "#8A6A34");
      ctx.fillStyle = tg; ctx.fill();
      ctx.save(); ctx.clip();
      for (var k = 1; k < 9; k++) { ctx.beginPath(); ctx.ellipse(chT.x, chT.y, chT.rx * k / 9, chT.ry * k / 9, 0, 0, Math.PI * 2); ctx.strokeStyle = "rgba(255,255,255," + (k % 2 ? 0.05 : 0.02) + ")"; ctx.lineWidth = 1; ctx.stroke(); }
      ctx.restore();
      ctx.beginPath(); ctx.ellipse(chT.x, chT.y, chT.rx, chT.ry, 0, 0, Math.PI * 2); ctx.strokeStyle = "rgba(255,244,214,0.55)"; ctx.lineWidth = 1.2; ctx.stroke();
    }
    function frame(now) {
      if (!playing) return;
      if (!t0) t0 = now - ((theta - Math.PI / 6) / (Math.PI * 2)) * PERIOD;
      theta = Math.PI / 6 + ((now - t0) % PERIOD) / PERIOD * Math.PI * 2;
      draw(theta);
      raf = requestAnimationFrame(frame);
    }
    function start() { if (playing || reduce.matches) return; playing = true; t0 = 0; raf = requestAnimationFrame(frame); }
    function stop() { playing = false; cancelAnimationFrame(raf); }
    root.addEventListener("teaser:play", start);
    root.addEventListener("teaser:pause", stop);
    if ("ResizeObserver" in window) new ResizeObserver(resize).observe(canvas); else { resize(); window.addEventListener("resize", resize); }
    resize();
    if (root.classList.contains("is-playing")) start();
  });
})();
</script>
