  </div></div>
</div>
<style>

.t09 .t09-cell.t09-g2 { animation-name: t09-drift-b; }
.t09 .t09-cell.t09-g3 { animation-name: t09-drift-c; }
.t09 .t09-cell.t09-fwd { animation-name: t09-drift-f; }

.t09 .t09-name { display: block; font-family: var(--gtm-font-ui); font-weight: var(--gtm-weight-ui-strong); font-size: calc(1.5 * var(--u)); line-height: 1.2; letter-spacing: -0.005em; white-space: nowrap; }

@keyframes t09-drift-c { 0%, 6% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; } 20%, 38% { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scale(var(--ss)); opacity: 0.22; } 67%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; } }
@keyframes t09-drift-f { 0%, 6% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; } 20%, 46% { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scale(var(--ss)); opacity: 0.22; } 76% { transform: translate(0, 0) rotate(0deg) scale(1.03); opacity: 1; } 80%, 100% { transform: translate(0, 0) rotate(0deg) scale(1); opacity: 1; } }

</style>
<script>

    ["Delta", "Tier two", 1, 3, 2, 3, [-12, 8, 2, -8]],

  });

</script>
