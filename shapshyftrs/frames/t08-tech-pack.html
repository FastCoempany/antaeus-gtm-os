<div class="stage f08" data-frame="tech-pack" style="--fx:0.50;--fy:0.50">
  <div class="stage-frame">
    <div class="stage-scene f08-sheet">
      <div class="f08-head">
        <span class="f08-wordmark">digs</span>

        <span class="f08-title">Long Sleeve Tee</span>
        <span class="f08-season">FW25</span>
      </div>
      <p class="f08-style">AC-LST-001 | LONG SLEEVE TEE | SIZE RANGE: S-XL | SAMPLE SIZE: M | STATUS: PROTO | TOPS</p>
      <div class="f08-body">

          <path class="f08-rib" d="M364 170 L372 179 L349 198 L341 189 Z" fill="none" stroke="#141414" stroke-width="1.3"/>
          <path class="f08-rib" d="M76 170 L68 179 L91 198 L99 189 Z" fill="none" stroke="#141414" stroke-width="1.3"/>

      <p class="f08-foot"><span>Exterior view</span><span>UPDATED: 06/15/2025</span></p>
    </div>
  </div>
</div>
<style>
/* Frame 8 — a technical drawing that annotates itself.
   Materials: the real graded spec (neckband 1", cuff 2", 3/8" seam allowance
   on every seam, 1" turnback at the hem) and the tech pack's own layout
   system — black-line flats on white with soft grey diagonal drape strokes,
   red leader lines with arrowheads running to caps callouts, rib as a hatch
   of fine parallels, hems as double dashed lines, a pipe-separated style
   string as the sub-header, and the dated footer.
   Every number and the style string are verbatim; nothing about this garment
   is invented. The construction drawn is the real one: set-in sleeve with a
   slight drop shoulder, a long sleeve at the graded 26" along the outer fold,
   straight body, straight hem, and 2-ply foldover rib at the neck and cuffs.
   The front is one piece cut on the fold, so nothing crosses it. The
   horizontal yoke seam that makes the back two panels belongs to the back and
   is not drawn, because this is the exterior front view.
   A drawn line arrives, it does not ease, so the leaders snap. */
.f08 .f08-sheet { background: #FFFFFF; overflow: hidden; }
.f08 .f08-head {
  position: absolute; left: 4%; right: 4%; top: 5.5%;
  display: flex; align-items: baseline; gap: calc(var(--u) * 1.6);
  font-family: var(--digs-sans);
}
.f08 .f08-wordmark { font-size: calc(var(--u) * 3.6); font-weight: 900; letter-spacing: -0.045em; color: #000; }
.f08 .f08-rule { flex: 0 0 1px; align-self: stretch; background: rgba(0, 0, 0, 0.35); }
.f08 .f08-title {
  flex: 1; text-align: center; text-transform: uppercase;
  font-size: calc(var(--u) * 2); font-weight: 400; letter-spacing: 0.14em; color: #141414;
}
.f08 .f08-season { font-size: calc(var(--u) * 2); font-weight: 700; color: #141414; }
.f08 .f08-style {
  position: absolute; left: 4%; right: 4%; top: 13.5%; margin: 0;
  font-family: var(--digs-sans); font-size: calc(var(--u) * 1.32);
  letter-spacing: 0.06em; color: #3B3B3B;
}
.f08 .f08-body { position: absolute; left: 4%; right: 4%; top: 20%; bottom: 12%; }
/* One coordinate space across the whole body: the garment occupies the left
   440 units and the leaders run out to 436 where the callout column begins,
   so a leader actually lands on the value it is calling out. */
.f08 .f08-flat { position: absolute; inset: 0; width: 100%; height: 100%; }
.f08 .f08-flat .f08-rib { stroke-dasharray: 2.4 2.4; }
.f08 .f08-leaders path {
  stroke-dasharray: 260; stroke-dashoffset: 260; opacity: 0;
  animation: f08-draw 9s linear infinite;
}
.f08 .f08-leaders path[data-l="0"] { animation-delay: 0.3s; }
.f08 .f08-leaders path[data-l="1"] { animation-delay: 2.55s; }
.f08 .f08-leaders path[data-l="2"] { animation-delay: 4.8s; }
.f08 .f08-leaders path[data-l="3"] { animation-delay: 7.05s; }
.f08 .f08-calls {
  position: absolute; right: 0; top: 4%; bottom: 4%; width: 46%;
  margin: 0; padding: 0 0 0 calc(var(--u) * 1.4); list-style: none;
  font-family: var(--digs-sans);
  display: grid; align-content: space-between;
}
.f08 .f08-calls li {
  display: grid; gap: calc(var(--u) * 0.2);
  opacity: 0.32; transition: opacity 180ms ease;
  animation: f08-call 9s linear infinite;
}
.f08 .f08-calls li[data-l="0"] { animation-delay: 0.3s; }
.f08 .f08-calls li[data-l="1"] { animation-delay: 2.55s; }
.f08 .f08-calls li[data-l="2"] { animation-delay: 4.8s; }
.f08 .f08-calls li[data-l="3"] { animation-delay: 7.05s; }
.f08 .f08-calls b {
  font-size: calc(var(--u) * 1.3); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.1em; color: #141414;
}
.f08 .f08-calls span { font-size: calc(var(--u) * 2.6); font-weight: 400; color: #C0392B; line-height: 1.1; }
.f08.is-lit .f08-calls li, .f08.is-lit .f08-leaders path { animation-play-state: paused; }
.f08 .f08-calls li.is-on { opacity: 1; }
.f08 .f08-calls li.is-off { opacity: 0.32; }
.f08 .f08-leaders path.is-on { stroke-dashoffset: 0; opacity: 1; }
.f08.is-lit .f08-leaders path:not(.is-on) { opacity: 0; }
.f08 .f08-foot {
  position: absolute; left: 4%; right: 4%; bottom: 5%; margin: 0;
  display: flex; justify-content: space-between;
  font-family: var(--digs-sans); font-size: calc(var(--u) * 1.3);
  text-transform: uppercase; letter-spacing: 0.1em; color: #6A6A6A;
}
@keyframes f08-draw {
  0%, 3% { stroke-dashoffset: 260; opacity: 0; }
  4% { stroke-dashoffset: 260; opacity: 1; }
  9%, 24% { stroke-dashoffset: 0; opacity: 1; }
  25%, 100% { stroke-dashoffset: 260; opacity: 0; }
}
@keyframes f08-call {
  0%, 3% { opacity: 0.32; }
  4%, 24% { opacity: 1; }
  25%, 100% { opacity: 0.32; }
}
@media (prefers-reduced-motion: reduce) {
  .f08 .f08-leaders path { stroke-dashoffset: 0; opacity: 1; }
  .f08 .f08-calls li { opacity: 1; }
}

/* The phone crop shows a band of the scene half its width, centred on the
   declared focal point. Anything outside fx +/- 25% is cut, so the composition
   moves inside the band rather than being sliced by it (brief 13). */
@container frame (max-width: 639px) {
  /* a wide document cannot survive a half-width band, so on the phone it
     stacks: the header, the flat, and the callouts as a list beneath */
  .f08 .f08-head {
    left: 27%; right: 27%; top: 3.5%;
    display: grid; grid-template-columns: auto 1fr; align-items: center;
    gap: calc(var(--u) * 1.2) calc(var(--u) * 1.4);
  }
  /* explicit placement: auto-flow puts the title before the season because
     that is the DOM order, and the two then stack into each other */
  .f08 .f08-wordmark { grid-area: 1 / 1; font-size: calc(var(--u) * 4.4); }
  .f08 .f08-rule { display: none; }
  .f08 .f08-season { grid-area: 1 / 2; justify-self: end; font-size: calc(var(--u) * 2.2); }
  .f08 .f08-title {
    grid-area: 2 / 1 / 3 / 3; text-align: left; font-size: calc(var(--u) * 2.4);
  }
  .f08 .f08-title { font-size: calc(var(--u) * 2); white-space: nowrap; }
  .f08 .f08-style { left: 27%; right: 27%; top: 22.5%; font-size: calc(var(--u) * 1.45); line-height: 1.55; }
  .f08 .f08-body { left: 27%; right: 27%; top: 31%; bottom: 11%; }
  .f08 .f08-flat { left: 0; right: 0; top: 0; height: 44%; width: 100%; }
  .f08 .f08-leaders { display: none; }
  /* Four callouts have to fit the box rather than be spaced across it: at this
     width a space-between grid taller than its container pushes the last row
     out through the bottom, which is how "3/8" ended up half cut and sitting
     on the footer. Sized so four rows total less than the height available. */
  .f08 .f08-calls {
    position: absolute; left: 0; right: 0; top: 48%; bottom: 4%; width: auto;
    padding: 0; align-content: space-between;
  }
  .f08 .f08-calls b { font-size: calc(var(--u) * 1.3); line-height: 1.25; }
  .f08 .f08-calls span { font-size: calc(var(--u) * 2.2); line-height: 1.1; }
  .f08 .f08-foot { left: 27%; right: 27%; bottom: 3%; font-size: calc(var(--u) * 1.5); }
}
</style>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  while (root && !root.classList.contains("stage")) root = root.previousElementSibling;
  if (!root) return;
  var items = Array.prototype.slice.call(root.querySelectorAll(".f08-calls li"));
  var leaders = Array.prototype.slice.call(root.querySelectorAll(".f08-leaders path"));
  function hold(i) {
    root.classList.add("is-lit");
    items.forEach(function (el, n) {
      el.classList.toggle("is-on", n === i);
      el.classList.toggle("is-off", n !== i);
    });
    leaders.forEach(function (el, n) { el.classList.toggle("is-on", n === i); });
  }
  function release() {
    root.classList.remove("is-lit");
    items.forEach(function (el) { el.classList.remove("is-on"); el.classList.remove("is-off"); });
    leaders.forEach(function (el) { el.classList.remove("is-on"); });
  }
  items.forEach(function (el, i) {
    el.tabIndex = 0;
    el.addEventListener("mouseenter", function () { hold(i); });
    el.addEventListener("focus", function () { hold(i); });
    el.addEventListener("mouseleave", release);
    el.addEventListener("blur", release);
  });
})();
</script>
