/* tokens/chrome.css — the page's own tokens (brief section 9).
   Pinned values only. The page has no accent color of its own. */
:root {
  --chrome-ground: #000000;         /* pinned */
  --chrome-text: #F4F4F0;           /* pinned, primary text */
  --chrome-text-2: #8E8E89;         /* pinned, secondary text */
  --chrome-button-bg: #F4F4F0;      /* pinned */
  --chrome-button-fg: #000000;      /* pinned */
  --chrome-font: "Schibsted Grotesk", system-ui, sans-serif; /* pinned default */
  --chrome-body: 15px;  --chrome-body-lh: 24px;      /* pinned scale */
  --chrome-sub: 18px;   --chrome-sub-lh: 28px;
  --chrome-caption: 22px; --chrome-caption-lh: 28px;
  --chrome-h2: 32px;    --chrome-h2-lh: 36px;
  --chrome-slogan: 64px; --chrome-slogan-lh: 1.02;
  --chrome-slogan-m: 40px; --chrome-slogan-m-lh: 1.05;
  --chrome-wordmark: 28px;
  --chrome-track-display: -0.02em;
  --chrome-measure: 66ch;
  --chrome-unit: 8px;
  --chrome-section: 96px; --chrome-section-m: 64px;
}

/* tokens/stage.css */
/* tokens/stage.css — the shared stage every teaser stands on (brief 6.1).
   True black, 16:10 native, 4:5 crop below 640px around the declared focal
   point, play/pause and reduced-motion conventions. Teasers add their own
   scoped rules under their root class (.t01 ... .t13). */
.stage {
  position: relative;
  aspect-ratio: 16 / 10;
  overflow: hidden;
  background: #000000;
  container-type: inline-size;
  isolation: isolate;
  --fx: 0.5;
  --fy: 0.5;
}
.stage > .stage-frame { position: absolute; inset: 0; }
@container (max-width: 639px) {
  .stage { aspect-ratio: 4 / 5; }
  .stage > .stage-frame {
    width: 200%;
    left: clamp(-100%, calc(50% - var(--fx) * 200%), 0%);
  }
}
/* Loops run only while the page runtime marks the stage playing (in view,
   not hovered, motion allowed). Paused at time zero they show the resting
   frame; paused mid-loop they hold their frame. */
.stage:not(.is-playing) * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  .stage * { animation: none !important; transition-duration: 0.001ms !important; }
}

<script>
/* Shared teaser runtime: one script for every stage on the page.
   In view (threshold 0.25) and not hovered: playing. Hover pauses.
   prefers-reduced-motion: reduce never plays; interactions still work.
   Each stage gets the class is-playing and the events teaser:play / teaser:pause,
   which script-driven teasers listen to. Variant A sets data-play-delay on body
   so a caption can fade in before its loop starts. */
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var delay = parseInt(document.body.getAttribute("data-play-delay") || "0", 10) || 0;
  var stages = Array.prototype.slice.call(document.querySelectorAll(".stage"));
  stages.forEach(function (el) {
    var inView = false, hover = false, started = false, timer = null;
    function apply(on) {
      if (el.classList.contains("is-playing") === on) return;
      el.classList.toggle("is-playing", on);
      el.dispatchEvent(new CustomEvent(on ? "teaser:play" : "teaser:pause"));
    }
    function update() {
      var on = inView && !hover && !reduce.matches;
      clearTimeout(timer);
      if (on && delay && !started) {
        timer = setTimeout(function () { started = true; apply(true); }, delay);
      } else {
        if (on) started = true;
        apply(on);
      }
    }
    el.__stageUpdate = function (v) { if (v !== undefined) inView = v; update(); };
    el.addEventListener("mouseenter", function () { hover = true; update(); });
    el.addEventListener("mouseleave", function () { hover = false; update(); });
  });
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { e.target.__stageUpdate(e.isIntersecting); });
    }, { threshold: 0.25 });
    stages.forEach(function (el) { io.observe(el); });
  } else {
    stages.forEach(function (el) { el.__stageUpdate(true); });
  }
  var onChange = function () { stages.forEach(function (el) { el.__stageUpdate(); }); };
  if (reduce.addEventListener) reduce.addEventListener("change", onChange); else reduce.addListener(onChange);
})();
</script>
