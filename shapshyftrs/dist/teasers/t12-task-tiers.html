/* tokens/stage.css */
.stage {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #000000;
  container-type: inline-size;
  isolation: isolate;
  --fx: 0.5;
  --fy: 0.5;
}
.stage > .stage-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
}
.stage > .stage-frame > .stage-scene { position: absolute; inset: 0; }

.stage > .stage-frame { --sw: 100cqw; }
.stage > .stage-frame > .stage-scene { --u: calc(var(--sw) / 100); }
@container (max-width: 639px) {
  .stage > .stage-frame { aspect-ratio: 4 / 5; --sw: 200cqw; }
  .stage > .stage-frame > .stage-scene {
    inset: auto;
    top: 0;
    height: 100%;
    width: 200%;
    left: clamp(-100%, calc(50% - var(--fx) * 200%), 0%);
  }
}

.stage:not(.is-playing) * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  .stage * { animation: none !important; transition-duration: 0.001ms !important; }
}

<style>
/* One plate, one key light, three lanes machined into it.
   Scene units: the plate runs 16 to 84 and bleeds nine units past both edges of the 4:5 crop,
   which shows scene 25 to 75. The well inside it runs 18.5 to 81.5, so its lanes, scales,
   tick ladders and load bars bleed past the crop too. Everything that has to be READ sits
   inside 27 to 74: the head block (lamp, tier name, slot count) on the 27 datum, the three

.t12 .t12-plate { position: absolute; left: calc(16 * var(--u)); top: calc(8.25 * var(--u)); width: calc(68 * var(--u)); height: calc(46 * var(--u)); border-radius: calc(0.75 * var(--u)); background: radial-gradient(92% 128% at 18% -10%, var(--ckp-hair-strong), var(--ckp-hair) 24%, var(--ckp-sheen) 46%, rgba(255, 255, 255, 0) 70%), linear-gradient(150deg, rgba(0, 0, 0, 0) 16%, var(--ckp-recess) 84%), var(--ckp-ground); box-shadow: inset calc(0.0625 * var(--u)) calc(0.0625 * var(--u)) 0 0 var(--ckp-bevel-light), inset calc(-0.0625 * var(--u)) calc(-0.0625 * var(--u)) 0 0 var(--ckp-bevel-dark), 0 0 0 calc(0.0625 * var(--u)) var(--ckp-bevel-dark); }

.t12 .t12-lane { position: absolute; left: 0; right: 0; height: calc(13.5 * var(--u)); }

.t12 .t12-track { position: absolute; left: calc(31.8 * var(--u)); width: calc(13.8 * var(--u)); top: 0; bottom: 0; box-shadow: inset calc(0.0625 * var(--u)) 0 0 var(--ckp-bevel-dark), inset calc(-0.0625 * var(--u)) 0 0 var(--ckp-bevel-dark), calc(-0.0625 * var(--u)) 0 0 var(--ckp-hair), calc(0.0625 * var(--u)) 0 0 var(--ckp-hair); }

/* Shared teaser runtime: one script for every stage on the page.

   prefers-reduced-motion: reduce never plays; interactions still work.

   gallery figure) delays a stage's first start so a caption or the hero copy
   can arrive before its loop begins. */
(function () {
