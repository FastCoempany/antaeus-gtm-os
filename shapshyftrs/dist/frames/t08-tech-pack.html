/* tokens/stage.css */
.stage {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #000000;
  container-type: inline-size;

  container-name: frame;
  isolation: isolate;
  --fx: 0.5;
  --fy: 0.5;
}
.stage > .stage-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
}
.stage > .stage-frame > .stage-scene { position: absolute; inset: 0; }

.stage > .stage-frame { --sw: 100cqw; }
.stage > .stage-frame > .stage-scene { --u: calc(var(--sw) / 100); }
@container frame (max-width: 639px) {
  .stage > .stage-frame { aspect-ratio: 4 / 5; --sw: 200cqw; }
  .stage > .stage-frame > .stage-scene {
    inset: auto;
    top: 0;
    height: 100%;
    width: 200%;
    left: clamp(-100%, calc(50% - var(--fx) * 200%), 0%);
  }
}

.stage:not(.is-playing) * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  .stage * { animation: none !important; transition-duration: 0.001ms !important; }
}

<style>
/* Frame 8 — a technical drawing that annotates itself.
   Materials: the real graded spec (neckband 1", cuff 2", 3/8" seam allowance
   on every seam, 1" turnback at the hem) and the tech pack's own layout
   system — black-line flats on white with soft grey diagonal drape strokes,
   red leader lines with arrowheads running to caps callouts, rib as a hatch
   of fine parallels, hems as double dashed lines, a pipe-separated style
   string as the sub-header, and the dated footer.
   Every number and the style string are verbatim; nothing about this garment
   is invented. The construction drawn is the real one: set-in sleeve with a
   slight drop shoulder, a long sleeve at the graded 26" along the outer fold,
   straight body, straight hem, and 2-ply foldover rib at the neck and cuffs.
   The front is one piece cut on the fold, so nothing crosses it. The
   horizontal yoke seam that makes the back two panels belongs to the back and
   is not drawn, because this is the exterior front view.
   A drawn line arrives, it does not ease, so the leaders snap. */
.f08 .f08-sheet { background: #FFFFFF; overflow: hidden; }

  position: absolute; left: 4%; right: 4%; top: 5.5%;

.f08 .f08-rule { flex: 0 0 1px; align-self: stretch; background: rgba(0, 0, 0, 0.35); }
.f08 .f08-title {
  flex: 1; text-align: center; text-transform: uppercase;
  font-size: calc(var(--u) * 2); font-weight: 400; letter-spacing: 0.14em; color: #141414;
}
.f08 .f08-season { font-size: calc(var(--u) * 2); font-weight: 700; color: #141414; }

  position: absolute; left: 4%; right: 4%; top: 13.5%; margin: 0;
  font-family: var(--digs-sans); font-size: calc(var(--u) * 1.32);
  letter-spacing: 0.06em; color: #3B3B3B;
}
.f08 .f08-body { position: absolute; left: 4%; right: 4%; top: 20%; bottom: 12%; }
/* One coordinate space across the whole body: the garment occupies the left
   440 units and the leaders run out to 436 where the callout column begins,
   so a leader actually lands on the value it is calling out. */
.f08 .f08-flat { position: absolute; inset: 0; width: 100%; height: 100%; }
.f08 .f08-flat .f08-rib { stroke-dasharray: 2.4 2.4; }

.f08 .f08-calls li.is-on { opacity: 1; }

/* The phone crop shows a band of the scene half its width, centred on the

   moves inside the band rather than being sliced by it (brief 13). */
@container frame (max-width: 639px) {
  /* a wide document cannot survive a half-width band, so on the phone it
     stacks: the header, the flat, and the callouts as a list beneath */
  .f08 .f08-head {

    display: grid; grid-template-columns: auto 1fr; align-items: center;
    gap: calc(var(--u) * 1.2) calc(var(--u) * 1.4);

  .f08 .f08-wordmark { grid-area: 1 / 1; font-size: calc(var(--u) * 4.4); }

  .f08 .f08-body { left: 27%; right: 27%; top: 31%; bottom: 11%; }

  }
  .f08 .f08-calls b { font-size: calc(var(--u) * 1.3); line-height: 1.25; }
  .f08 .f08-calls span { font-size: calc(var(--u) * 2.2); line-height: 1.1; }
  .f08 .f08-foot { left: 27%; right: 27%; bottom: 3%; font-size: calc(var(--u) * 1.5); }
}
</style>
<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  while (root && !root.classList.contains("stage")) root = root.previousElementSibling;
  if (!root) return;
  var items = Array.prototype.slice.call(root.querySelectorAll(".f08-calls li"));
  var leaders = Array.prototype.slice.call(root.querySelectorAll(".f08-leaders path"));
  function hold(i) {
    root.classList.add("is-lit");
    items.forEach(function (el, n) {
      el.classList.toggle("is-on", n === i);
      el.classList.toggle("is-off", n !== i);
    });
    leaders.forEach(function (el, n) { el.classList.toggle("is-on", n === i); });
  }
  function release() {
    root.classList.remove("is-lit");
    items.forEach(function (el) { el.classList.remove("is-on"); el.classList.remove("is-off"); });
    leaders.forEach(function (el) { el.classList.remove("is-on"); });
  }
  items.forEach(function (el, i) {
    el.tabIndex = 0;
    el.addEventListener("mouseenter", function () { hold(i); });
    el.addEventListener("focus", function () { hold(i); });
    el.addEventListener("mouseleave", release);
    el.addEventListener("blur", release);
  });
})();
</script>
</div>
<script>
/* Shared frame runtime: one script for every stage on the page.
   In view (threshold 0.25) and not hovered: playing. Hover pauses.
   prefers-reduced-motion: reduce never plays; interactions still work.
   Each stage gets the class is-playing and the events frame:play / frame:pause,
   which script-driven frames listen to. The nearest ancestor with data-play-delay (the body, a hero, a
   gallery figure) delays a stage's first start so a caption or the hero copy
   can arrive before its loop begins. */
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var stages = Array.prototype.slice.call(document.querySelectorAll(".stage"));
  stages.forEach(function (el) {
    var holder = el.closest("[data-play-delay]");
    var delay = holder ? (parseInt(holder.getAttribute("data-play-delay"), 10) || 0) : 0;
    var inView = false, hover = false, started = false, timer = null;
    function apply(on) {
      if (el.classList.contains("is-playing") === on) return;
      el.classList.toggle("is-playing", on);
      el.dispatchEvent(new CustomEvent(on ? "frame:play" : "frame:pause"));
    }
    function update() {
      var on = inView && !hover && !reduce.matches;
      clearTimeout(timer);
      if (on && delay && !started) {
        timer = setTimeout(function () { started = true; apply(true); }, delay);
      } else {
        if (on) started = true;
        apply(on);
      }
    }
    el.__stageUpdate = function (v) { if (v !== undefined) inView = v; update(); };
    el.addEventListener("mouseenter", function () { hover = true; update(); });
    el.addEventListener("mouseleave", function () { hover = false; update(); });
  });
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { e.target.__stageUpdate(e.isIntersecting); });
    }, { threshold: 0.25 });
    stages.forEach(function (el) { io.observe(el); });
  } else {
    stages.forEach(function (el) { el.__stageUpdate(true); });
  }
  var onChange = function () { stages.forEach(function (el) { el.__stageUpdate(); }); };
  if (reduce.addEventListener) reduce.addEventListener("change", onChange); else reduce.addListener(onChange);
})();
</script>
