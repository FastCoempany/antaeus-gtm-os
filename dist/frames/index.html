/* tokens/stage.css */
.stage {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #000000;
  container-type: inline-size;

  container-name: frame;
  isolation: isolate;
  --fx: 0.5;
  --fy: 0.5;
}
.stage > .stage-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
}
.stage > .stage-frame > .stage-scene { position: absolute; inset: 0; }

.stage > .stage-frame { --sw: 100cqw; }
.stage > .stage-frame > .stage-scene { --u: calc(var(--sw) / 100); }
@container frame (max-width: 639px) {
  .stage > .stage-frame { aspect-ratio: 4 / 5; --sw: 200cqw; }
  .stage > .stage-frame > .stage-scene {
    inset: auto;
    top: 0;
    height: 100%;
    width: 200%;
    left: clamp(-100%, calc(50% - var(--fx) * 200%), 0%);
  }
}

.stage:not(.is-playing) * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  .stage * { animation: none !important; transition-duration: 0.001ms !important; }
}

<h1>shapshyftrs frames</h1>
<p>All twelve frames, gallery order, for review.</p>
<div class="sheet-grid">
<figure class="sheet-item"><div class="sheet-frame"><!-- frame id=knurl-wall num=1 source=puff-junction focal=50%,50% loop=9 interactive=no -->
<div class="stage f01" data-frame="knurl-wall" style="--fx:0.50;--fy:0.50" role="img"
     aria-label="A wall of brass diamond knurling, lit by a light travelling slowly across it; as the light crosses the centre a shallow wordmark surfaces out of the metal and sinks back">
  <div class="stage-frame">
    <div class="stage-scene">
      <div class="f01-field m-knurl m-knurl--band"></div>
      <div class="f01-mark"><span class="f01-puff">puff</span><span class="f01-junction">JUNCTION</span></div>
      <div class="f01-rake m-knurl-rake"></div>
      <div class="f01-vignette"></div>
    </div>
  </div>
</div>
<style>
/* Frame 1 — the knurl at architectural scale.
   Materials: pj-knurl (1.26 mm pitch, 1.65 x 1.9 lands, point-up at 1.15:1,
   grooves crossing at 49 degrees) and pj-brass's whisper deboss (three
   terraces, 0.2 mm, letters left at the original surface).
   The knurl has never been the subject in this brand; it has only ever been a
   band on a knob 63 mm across. Here it is the wall, and the only other event
   is a light crossing it. Metal does not ease, so the rake runs at constant
   velocity. */
.f01 .f01-field { position: absolute; inset: 0; --k-cell: calc(var(--u) * 5.4); }
.f01 .f01-rake { animation: f01-rake 9s linear infinite; }
.f01 .f01-vignette {
  position: absolute; inset: 0; pointer-events: none;
  background: radial-gradient(120% 96% at 50% 46%, transparent 38%, rgba(0, 0, 0, 0.62) 100%);
}
/* The mark is a whisper: one raking-light edge, and almost invisible from the
   wrong angle. Its opacity rides the same clock as the light. */
.f01 .f01-mark {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  display: grid; justify-items: center; gap: calc(var(--u) * 0.6);
  font-family: var(--pj-display); font-style: italic;
  animation: f01-surface 9s linear infinite;
}
/* The deboss is 0.2 mm deep. The study is emphatic about what that looks
   like: "astonishingly shallow -- in the hero renders it is barely legible,
   catching light on one edge only. If you rebuild this, the mark should be a
   whisper", and the brand rule is that the mark whispers on an object and
   shouts on paper, never the other way round.
   The first build had the technique right and the values wrong. A text-shadow
   is a whole copy of the glyph, not an edge, so two offset copies at 0.85 and
   0.75 alpha stack into a solid cream letter with a hard dark rim -- the
   loudest object in the frame, which is the swap the rule names. At these
   alphas the knurl reads straight through the letterform and only the two
   edges catch, which is what 0.2 mm actually does to light. */
.f01 .f01-puff {
  font-size: calc(var(--u) * 13); font-weight: 700; line-height: 0.82;
  letter-spacing: -0.02em; text-transform: lowercase;
  color: transparent;
  text-shadow:
    calc(var(--u) * -0.1) calc(var(--u) * -0.1) 0 rgba(255, 248, 226, 0.26),
    calc(var(--u) * 0.11) calc(var(--u) * 0.11) 0 rgba(20, 12, 2, 0.3);
}
.f01 .f01-junction {
  font-size: calc(var(--u) * 3.1); font-weight: 500; letter-spacing: 0.44em;
  text-indent: 0.44em; color: transparent;
  text-shadow:
    calc(var(--u) * -0.07) calc(var(--u) * -0.07) 0 rgba(255, 248, 226, 0.24),
    calc(var(--u) * 0.08) calc(var(--u) * 0.08) 0 rgba(20, 12, 2, 0.28);
}
@keyframes f01-rake { from { background-position: -140% 0; } to { background-position: 240% 0; } }
@keyframes f01-surface {
  0%, 34% { opacity: 0; }
  46% { opacity: 0.85; }
  58% { opacity: 0.85; }
  72%, 100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  .f01 .f01-rake { background-position: 44% 0; }
  .f01 .f01-mark { opacity: 1; }
}
</style>

<figure class="sheet-item"><div class="sheet-frame"><!-- frame id=ground-line num=2 source=antaeus focal=50%,58% loop=8 interactive=no -->

            <path d="M14 38L24 10l10 28"/>

          </g>
          <path d="M2 38h44" stroke="var(--an-forest)" stroke-width="3.2" stroke-linecap="butt"/>

</div>
<style>
/* Frame 2 — the mark as a horizon.
   Materials: an-field (34 px grid at rgba(10,28,64,.08), the two corner
   washes, the vignette) and the Grounded-A's exact geometry — legs
   M14 38L24 10l10 28, crossbar M18.2 28h11.6, ground M2 38h44, butt caps and
   mitered joins.
   The ground runs 12 units past each foot: 2.2x the width of the letter. That
   overhang is the mark. The settled auth gate does this at 118 px as a login
   affordance; here the line is a horizon and the letter is a building — and
   the lift is the product's own state device, so the A floats and the ground
   never moves. */
.f02 .f02-field { position: absolute; inset: 0; }
.f02 .f02-mark {
  position: absolute; left: 50%; bottom: 3%;
  height: 74%; width: auto; transform: translateX(-50%); overflow: visible;
}
.f02 .f02-a {
  transform-origin: 24px 24px;
  animation: f02-lift 8s cubic-bezier(0.2, 0.7, 0.2, 1) infinite;
}

  position: absolute; left: 0; right: 0; bottom: 0; height: 18.4%;

  background: rgba(27, 94, 63, 0.14);

.f02 .f02-earth i:nth-child(2) { top: 52%; }
.f02 .f02-earth i:nth-child(3) { top: 79%; }
@keyframes f02-lift {
  0%, 18% { transform: none; opacity: 1; }

  86%, 100% { transform: none; opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { .f02 .f02-a { transform: none; opacity: 1; } }
</style>
</div><figcaption><b>02 ground-line</b>, Antaeus GTM OS. A mark that stands on a line. Loop 8s, interactive no.</figcaption></figure>
<figure class="sheet-item"><div class="sheet-frame"><!-- frame id=blackout num=3 source=darkest-shades focal=50%,50% loop=10 interactive=no -->

     aria-label="A field of near-black you cannot see through. One broad soft sheen wipes across it from lower left to upper right, and a single hard specular dot sits near the top. Set small along the lower edge: See Everything. Reveal Nothing.">

    <div class="stage-scene">

      <div class="f03-groove"></div>

</div>
<style>
/* Frame 3 — the lens as the whole surface.
   Materials: ds-lens's blackout recipe — a #151515 fill, one broad soft sheen
   band at #4A–#6A across 30% of the width, one small hard specular dot near
   the top edge, and the faint 2–4 px inner shadow where a lens meets its
   groove.
   The tagline and the product make the same argument, which is rare. The
   sheen crosses once, slowly, and nothing else happens. */
.f03 .f03-lens { position: absolute; inset: 0; animation: f03-sheen 10s ease-in-out infinite; }
.f03 .f03-groove {
  position: absolute; inset: 0; pointer-events: none;
  box-shadow: inset 0 0 calc(var(--u) * 3.4) rgba(0, 0, 0, 0.9);
}
/* Ragged right, not centred: the brand's headline lockup is caps, few words,
   ragged right, leading near 0.95 -- NOT JUST / SUNGLASSES. / A STATEMENT.
   Centring is the one thing that lockup never does. */
.f03 .f03-line {
  position: absolute; left: 7%; right: 7%; bottom: 8.5%;
  margin: 0; text-align: left;
  font-family: var(--ds-display); font-weight: 700; text-transform: uppercase;
  font-size: calc(var(--u) * 3.3); line-height: 0.95;
  letter-spacing: 0.055em; color: rgba(236, 236, 236, 0.9);
}
@keyframes f03-sheen {
  0% { --sheen: 4; }
  100% { --sheen: 96; }
}
@property --sheen { syntax: "<number>"; inherits: true; initial-value: 50; }
@media (prefers-reduced-motion: reduce) { .f03 .f03-lens { --sheen: 46; } }

/* The phone crop shows a band of the scene half its width, centred on the
   declared focal point. Anything outside fx +/- 25% is cut, so the composition
   moves inside the band rather than being sliced by it (brief 13). */
@container frame (max-width: 639px) {
  .f03 .f03-line { left: 27%; right: 27%; bottom: 10%; font-size: calc(var(--u) * 4.6); }
}
</style>
</div><figcaption><b>03 blackout</b>, DARKEST SHADES. A lens you cannot see through. Loop 10s, interactive no.</figcaption></figure>
<figure class="sheet-item"><div class="sheet-frame"><!-- frame id=iris-seam num=4 source=aesdr focal=50%,46% loop=8 interactive=yes -->
<div class="stage f04" data-frame="iris-seam" style="--fx:0.50;--fy:0.46">
  <div class="stage-frame">
    <div class="stage-scene f04-scene m-ae-field">
      <div class="f04-words" aria-live="off">
        <span class="f04-word m-iris-text" data-i="0">Owning</span>
        <span class="f04-word m-iris-text" data-i="1">Untamed</span>

(function () {
  var root = document.currentScript.previousElementSibling;
  while (root && !root.classList.contains("stage")) root = root.previousElementSibling;
  if (!root) return;
  var plate = root.querySelector(".f09-plate");

  plate.setAttribute("role", "slider");
  plate.setAttribute("aria-label", "Move the light behind the acetate");
  plate.setAttribute("aria-valuemin", "0");
  plate.setAttribute("aria-valuemax", "100");
  plate.setAttribute("aria-valuenow", "50");
  var x = 50, y = 50, down = false;
  function put(nx, ny) {
    x = Math.max(4, Math.min(96, nx));
    if (ny !== undefined) y = Math.max(8, Math.min(92, ny));
    root.classList.add("is-led");
    plate.style.setProperty("--glow-x", x + "%");

  function at(e) {
    var r = plate.getBoundingClientRect();
    put(((e.clientX - r.left) / r.width) * 100, ((e.clientY - r.top) / r.height) * 100);
  }
  plate.addEventListener("pointerdown", function (e) {
    down = true; plate.setPointerCapture(e.pointerId); at(e); e.preventDefault();
  });

   grayscale(1) opacity .3 IN PLACE while the dot stops breathing, then the
   rail folds translateX(-101%), then the hairline left behind is plainly

<script>
(function () {
  var root = document.currentScript.previousElementSibling;
  while (root && !root.classList.contains("stage")) root = root.previousElementSibling;
  if (!root) return;
  var btn = root.querySelector(".f12-switch");
  var label = root.querySelector(".f12-switch-label");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var busy = false, off = false, timers = [];
  function clear() { timers.forEach(clearTimeout); timers = []; }
  function later(fn, ms) { timers.push(setTimeout(fn, reduce.matches ? 0 : ms)); }
  btn.addEventListener("click", function () {
    if (busy) return;
    busy = true; clear();
    if (!off) {
      /* three beats: still in place, then fold, then the dead hairline */
      root.classList.add("is-still");
      later(function () { root.classList.add("is-off"); }, 300);
      later(function () { off = true; busy = false; label.textContent = "Turn it back on";
        btn.setAttribute("aria-pressed", "true"); }, 780);
    } else {
      root.classList.remove("is-off");
      later(function () {
        root.classList.remove("is-still");
        root.classList.add("is-waking");
      }, 420);
      later(function () { root.classList.remove("is-waking"); off = false; busy = false;

<script>
/* Shared frame runtime: one script for every stage on the page.
   In view (threshold 0.25) and not hovered: playing. Hover pauses.
   prefers-reduced-motion: reduce never plays; interactions still work.
   Each stage gets the class is-playing and the events frame:play / frame:pause,
   which script-driven frames listen to. The nearest ancestor with data-play-delay (the body, a hero, a
   gallery figure) delays a stage's first start so a caption or the hero copy
   can arrive before its loop begins. */
(function () {
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
  var stages = Array.prototype.slice.call(document.querySelectorAll(".stage"));
  stages.forEach(function (el) {
    var holder = el.closest("[data-play-delay]");
    var delay = holder ? (parseInt(holder.getAttribute("data-play-delay"), 10) || 0) : 0;
    var inView = false, hover = false, started = false, timer = null;
    function apply(on) {
      if (el.classList.contains("is-playing") === on) return;
      el.classList.toggle("is-playing", on);
      el.dispatchEvent(new CustomEvent(on ? "frame:play" : "frame:pause"));
    }
    function update() {
      var on = inView && !hover && !reduce.matches;
      clearTimeout(timer);
      if (on && delay && !started) {
        timer = setTimeout(function () { started = true; apply(true); }, delay);
      } else {
        if (on) started = true;
        apply(on);
      }
    }
    el.__stageUpdate = function (v) { if (v !== undefined) inView = v; update(); };
    el.addEventListener("mouseenter", function () { hover = true; update(); });
    el.addEventListener("mouseleave", function () { hover = false; update(); });
  });

    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { e.target.__stageUpdate(e.isIntersecting); });
    }, { threshold: 0.25 });
    stages.forEach(function (el) { io.observe(el); });
  } else {
    stages.forEach(function (el) { el.__stageUpdate(true); });
  }
  var onChange = function () { stages.forEach(function (el) { el.__stageUpdate(); }); };
  if (reduce.addEventListener) reduce.addEventListener("change", onChange); else reduce.addListener(onChange);
})();
</script>
