/* tokens/stage.css */
.stage {
  position: relative;
  width: 100%;
  overflow: hidden;
  background: #000000;
  container-type: inline-size;
  isolation: isolate;
  --fx: 0.5;
  --fy: 0.5;
}
.stage > .stage-frame {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  overflow: hidden;
}
.stage > .stage-frame > .stage-scene { position: absolute; inset: 0; }

.stage > .stage-frame { --sw: 100cqw; }
.stage > .stage-frame > .stage-scene { --u: calc(var(--sw) / 100); }
@container (max-width: 639px) {
  .stage > .stage-frame { aspect-ratio: 4 / 5; --sw: 200cqw; }
  .stage > .stage-frame > .stage-scene {
    inset: auto;
    top: 0;
    height: 100%;
    width: 200%;
    left: clamp(-100%, calc(50% - var(--fx) * 200%), 0%);
  }
}

.stage:not(.is-playing) * { animation-play-state: paused !important; }
@media (prefers-reduced-motion: reduce) {
  .stage * { animation: none !important; transition-duration: 0.001ms !important; }
}

.t03 .t03-layer.t03-b { opacity: 0; }

   so the boxes TILE instead: no overlap, no gap, which puts the boundary
   between two swatches on the true midpoint between their dots. Nothing is
   lifted over a neighbour, so no swatch can ever shadow the one beside it.
   The dot itself is the button, at its original size and centre, so the focus
   ring lands 2px off the visible disc. */
.t03 .t03-swatches { position: absolute; left: 0; right: 0; top: 83%; display: flex; justify-content: center; gap: calc(1.1 * var(--u)); --t03-dot: calc(2.6 * var(--u)); --t03-pitch: calc(3.7 * var(--u)); /* a fingertip, not a fraction of the frame: this floor is in px on purpose, and it clears 44 by a hair so sub-pixel snapping cannot take it under */ --t03-hit-h: max(45px, calc(3.9 * var(--u))); --t03-slop-x: calc((var(--t03-pitch) - var(--t03-dot)) / 2); --t03-slop-y: calc((var(--t03-hit-h) - var(--t03-dot)) / 2); }
.t03 .t03-sw { flex: 0 0 auto; position: relative; overflow: visible; width: var(--t03-dot); height: var(--t03-dot); margin: 0; padding: 0; border: 0; -webkit-appearance: none; appearance: none; border-radius: 50%; cursor: pointer; background: var(--sw-frame); box-shadow: 0 0 0 calc(0.0625 * var(--u)) rgba(255,255,255,0.25); transition: transform 200ms ease, box-shadow 200ms ease; }

.t03 .t03-sw::before { content: ""; position: absolute; inset: calc(-1 * var(--t03-slop-y)) calc(-1 * var(--t03-slop-x)); transition: transform 200ms ease; }

.t03 .t03-sw[aria-pressed="true"]::before { transform: translateY(calc(0.25 * var(--u))); }
